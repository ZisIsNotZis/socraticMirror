- id: scen_rank_deficient
  title: 嵌入矩阵重复方向与低秩适配
  brief: 7B模型的4096维嵌入中出现重复方向；LoRA秩8，显存24GB，团队把秩调到256却无验证集收益。
  asks:
  - type: diagnosis
    angle: 如何验证秩亏并稳定求解，而不是只加一行逆矩阵调用？
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - linear_algebra
  - matrix_multiplication
  - svd
  - lora
  expected_elements:
  - 机制: 低秩矩阵乘积限定可更新子空间；奇异值反映方向退化。
  - 应用: 比较更新矩阵谱、训练与验证误差，固定预算扫秩。
  - 边界: 嵌入共线不直接说明任务不可解；更大秩不保证泛化。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_pca_budget
  title: 检索嵌入低秩压缩
  brief: 10000条2048维大模型嵌入需压到64维；内存512MiB，查询和文档却用了不同投影。
  asks:
  - type: diagnosis
    angle: 比较中心化后协方差特征分解与直接截断 SVD 的关系及内存。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - svd
  - matrix_multiplication
  - linear_algebra
  - dense_retrieval
  expected_elements:
  - 机制: SVD得到低秩子空间，查询与文档必须在可比较空间计算相似度。
  - 应用: 训练集拟合共享投影，测检索召回及工作区内存。
  - 边界: 保留大方差不保证保留语义相关性；投影不能混用。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2004.04906 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_robust_constant
  title: 预训练长尾样本主导损失
  brief: 300B token语料中1%损坏文本造成40%总loss，训练只能再跑2天，团队准备直接删掉所有高loss样本。
  asks:
  - type: application
    angle: 推导平方损失与绝对损失最优常数，并解释目标尺度。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - calculus
  - maximum_likelihood
  - data_preprocessing
  - cross_entropy
  expected_elements:
  - 机制: 交叉熵对应token似然，高loss可能是噪声也可能是困难域。
  - 应用: 按域和样本质量分层审计，比较过滤前后留出损失。
  - 边界: 删除难例可能破坏稀有能力，均值loss不足以判断质量。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_xor_mlp
  title: Transformer前馈层误删激活
  brief: 7B模型把SwiGLU替换成两层无激活Linear，训练2000步后代码能力下降；预算只够2组消融。
  asks:
  - type: application
    angle: 从表达能力和梯度而非调大训练轮数入手定位。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - mlp
  - activation
  - backpropagation
  - swiglu
  expected_elements:
  - 机制: 纯仿射复合仍是仿射映射，门控非线性改变表达能力。
  - 应用: 对齐参数量和token预算比较，有梯度不等于有足够表达能力。
  - 边界: 容量不足与优化失败不能只凭训练loss区分。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_gradient_graph
  title: 共享参数的梯度验算
  brief: 改写 D2L 反向传播习题：单批 16×32 输入，经共享 W 的两个分支求和后接标量损失；手写反向仅保留最后分支梯度，有限差分误差约 50%。
  asks:
  - type: diagnosis
    angle: 画出共享节点并说明梯度形状和累加位置。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - backpropagation
  - computational_graph
  - chain_rule
  - calculus
  - autodiff
  expected_elements:
  - 机制: 链式法则沿所有路径传播，同一 W 的总梯度为各路径贡献之和，形状与 W 一致。
  - 应用: 用小规模 float64 中心差分核验，清零旧梯度但不覆盖同一次图的分支贡献。
  - 边界: ReLU 拐点处数值差分未必匹配某个次梯度；训练时禁用随机层再检查。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_timing
  title: 数据翻倍后学习率日程失真
  brief: 改写 D2L minibatch SGD 的重复数据习题：原 10000 样本，batch=100，每 10 epoch 降学习率十倍；数据被逐条复制成 20000 条，同事保持 epoch 数比较 SGD
    与全批梯度下降。
  asks:
  - type: diagnosis
    angle: 区分经验目标、更新次数与墙钟时间，给出公平对照。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - gradient_descent
  - sgd
  - minibatch_sgd
  - learning_rate_schedule
  expected_elements:
  - 机制: 复制不改变平均经验损失，但改变每 epoch 的更新步数；小批梯度有抽样噪声。
  - 应用: 同时记录 optimizer steps、样本数和耗时，以相同更新或计算预算比较并重设 scheduler。
  - 边界: 重复样本不增加独立信息；按 epoch 或按 step 衰减不是等价实验。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_optimization/minibatch-sgd.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_adam_sparse
  title: 稀疏词向量的自适应步长
  brief: 沿 D2L Adam 的一二阶矩更新：词表 50000，embedding 维数 128，常见词每步更新而罕见词隔 1000 步才出现；从 SGD 改 Adam 后前十步损失跳变。
  asks:
  - type: diagnosis
    angle: 追踪前几步矩估计与偏差校正，而不是断言 Adam 总比 SGD 稳。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - adam
  - sgd
  - learning_rate_schedule
  - word_embedding
  expected_elements:
  - 机制: Adam 维护梯度一阶矩和平方梯度二阶矩，初始化为零导致早期偏差需校正。
  - 应用: 核对 beta、epsilon、偏差校正和学习率；对常见与罕见词分别记录更新范数。
  - 边界: Adam 不保证相同学习率下更好泛化；稀疏更新语义和优化器实现兼容性必须核验。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_optimization/adam.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_bn_small_batch
  title: 显存限制下的 BN 统计量
  brief: ResNet级预训练视觉骨干以每卡2张图在4卡继续训练，BN验证波动；对照ViT的LayerNorm，显存只剩1GB。
  asks:
  - type: diagnosis
    angle: 先审计运行统计量、每卡统计与推理模式。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - batch_norm
  - minibatch_sgd
  - data_parallelism
  - layer_norm
  expected_elements:
  - 机制: BN 使用批统计并在推理使用运行统计；小批和跨卡统计范围会改变估计噪声。
  - 应用: 比对 train/eval 输出与运行均值方差，尝试同步 BN、冻结可靠统计或不依赖批维的归一化。
  - 边界: 梯度累积不会自动合并 BN 每次前向的统计量；batch=2 本身也不必然使所有卷积 BN 失效。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_convolutional-modern/batch-norm.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_house_leak
  title: 预训练去污染中的划分泄漏
  brief: 10万条指令先扩写5倍再随机划分，验证分高20点；原始作者信息缺失且不能重标。
  asks:
  - type: diagnosis
    angle: 设计不读取留出标签的特征与验证流水线。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - train_test_split
  - validation_split
  - data_preprocessing
  - data_deduplication
  expected_elements:
  - 机制: 同源改写跨划分导致泄漏。
  - 应用: 按原始样本和近重复簇分组后划分，独立保留污染审计集。
  - 边界: 去重阈值不证明语义无泄漏；不可把新验证分直接与旧分比较。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_shift_monitor
  title: 模型迁移到新域后失准
  brief: 客服大模型上线新地区后拒答率从5%涨到25%；方言占30%，日志禁止留原文。
  asks:
  - type: diagnosis
    angle: 区分输入漂移警报与性能已经下降的证据。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - distribution_shift
  - model_calibration
  - model_deployment
  - data_preprocessing
  expected_elements:
  - 机制: 域变化影响输入和任务分布，旧校准不自动适用。
  - 应用: 做本地脱敏分层评测，固定模板与版本对比。
  - 边界: 仅观察拒答率不能区分安全策略变化与理解能力下降。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_rare_fraud
  title: 安全分类头的高准确率陷阱
  brief: 10000条LLM安全请求只有50条攻击，护栏全放行仍有99.5%准确率；误拒普通用户有业务成本。
  asks:
  - type: application
    angle: 根据审核容量选阈值并用混淆矩阵量化漏报。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - precision_recall
  - accuracy
  - f1_score
  - guardrails
  expected_elements:
  - 机制: 类别失衡使准确率掩盖漏报。
  - 应用: 明确阳性定义，计算precision/recall/F1并扫描阈值。
  - 边界: 指标随基准患病率变化，离线高分不证明对新攻击可靠。
  difficulty: medium
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/safety/ — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_calibrate
  title: 正确率不变却风险定价错误
  brief: 沿 scikit-learn 温度缩放例子：三分类模型准确率 85%，声称置信度 0.9 的 1000 条记录实际仅 700 条正确；另留出 2000 条校准数据。
  asks:
  - type: diagnosis
    angle: 解释为何提高概率可信度不一定提升 argmax 正确率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - model_calibration
  - accuracy
  - validation_split
  - softmax
  expected_elements:
  - 机制: 正温度缩放 logits 不改变类别排序；校准关注预测概率与经验频率的一致性。
  - 应用: 仅在独立校准集拟合温度，以可靠性图、Brier 或 log loss 检查留出集表现。
  - 边界: 温度缩放不能修复错误类别排序；总体校准掩盖分群偏差且漂移后可能失效。
  difficulty: high
  source:
    type: engineering
    ref: https://scikit-learn.org/stable/modules/calibration.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_perplexity_tokens
  title: 不同 tokenizer 的困惑度不能直比
  brief: 沿 D2L 语言模型：同一 10000 字符测试文本，模型 A 切成 5000 token，模型 B 为 8000 token；两者报告 token perplexity 18 与 12，团队欲宣布 B 更强。
  asks:
  - type: diagnosis
    angle: 将归一化单位与测试文本固定后再比较。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - perplexity
  - language_model
  - tokenization
  - cross_entropy
  expected_elements:
  - 机制: 困惑度为平均 token 负对数似然的指数，token 单位改变会改变分母。
  - 应用: 使用一致文本和切分协议，或转为每字节负对数似然并披露边界符处理。
  - 边界: 低困惑度不直接等于事实性或下游任务质量；不同支持集及未知词处理仍会妨碍比较。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_online
  title: prefill批处理拖慢短请求
  brief: 长短请求长度相差100倍；批量32时吞吐高但短请求P99达8秒，SLO为2秒且只一张卡。
  asks:
  - type: diagnosis
    angle: 划定特征可用时间并验证训练和服务语义一致。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - prefill_decode
  - continuous_batching
  - latency
  - throughput
  expected_elements:
  - 机制: prefill与decode资源模式不同，批处理在吞吐与尾延迟间权衡。
  - 应用: 记录TTFT和token间延迟，设token预算与准入。
  - 边界: 单看每秒token数不能保证用户延迟。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2309.06180 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_distill_edge
  title: 端侧压缩不是只看参数量
  brief: 改写蒸馏论文的集成到单模型任务：教师为 5 模型集成，学生要在 4 GiB 手机上运行，模型文件上限 50 MiB、单条 p95 低于 80 ms；只能用现有带标签训练集。
  asks:
  - type: diagnosis
    angle: 设计学生训练与真实端侧验收，不把压缩率当延迟加速率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - model_compression
  - knowledge_distillation
  - model_deployment
  - latency
  expected_elements:
  - 机制: 软目标包含类别间相对信息；温度与硬标签损失权重影响学生学习信号。
  - 应用: 混合软硬损失，比较相同数据下学生基线，实测设备峰值内存、尾延迟和分群质量。
  - 边界: 参数更少不必然更快；教师错误可被继承，未代表的端侧输入分布不能靠蒸馏修复。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1503.02531 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_beam_translation
  title: 翻译 beam 加宽反而偏短
  brief: 沿 D2L beam search：中英翻译最长输出 64 token，beam 从 1 改 8，单请求预算 200 ms；总 log 概率更优但译文常提前输出 EOS。
  asks:
  - type: application
    angle: 解释搜索目标、长度偏置和延迟，而不是只加宽 beam。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - beam_search
  - autoregressive_decoding
  - language_model
  expected_elements:
  - 机制: 自回归序列概率为条件概率乘积；直接求和 log 概率常偏好较短输出，beam 是近似搜索。
  - 应用: 核对 EOS 与长度处理，在验证集试长度归一化并同时测质量及耗时。
  - 边界: 更宽 beam 不保证任务指标提升；归一化改变目标而非证明找到了真实最优译文。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-modern/beam-search.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_lenet_shapes
  title: ResNet与ViT的小目标信息损失
  brief: 预训练视觉骨干输入224，4像素药片经连续stride2后消失；端侧内存2GB，不能直接全图4K。
  asks:
  - type: application
    angle: 逐层计算形状，区分参数共享与下采样损失。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - convolution
  - cnn
  - padding_stride
  - pooling
  expected_elements:
  - 机制: 下采样降低空间分辨率，局部信息可能不可恢复。
  - 应用: 比较分块、裁剪、多尺度与保留高分辨率特征。
  - 边界: 放大输出特征图无法恢复已丢失信号；更多参数未必解决采样损失。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_crowded_nms
  title: 视觉大模型定位评估的重复框
  brief: VLM定位100张货架图，重复输出300个框以提高召回；标签只含主要物体，脏遮挡占40%。
  asks:
  - type: diagnosis
    angle: 说明重叠不一定是重复目标，并选择可验证的修复方向。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - visual_grounding
  - object_detection
  - vlm
  - robustness
  expected_elements:
  - 机制: 定位质量不能只看是否覆盖，重复与漏标影响度量。
  - 应用: 明确匹配规则并审计遮挡、重复和漏标，人工抽样核验。
  - 边界: 低分可能来自标注不全；更密集输出不等于理解更好。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_segmentation_crop
  title: 视觉指令数据增广破坏指代
  brief: 500张带框指令图随机裁剪后仍使用原坐标；20%问题指向右侧物体，不能重新标整批图。
  asks:
  - type: diagnosis
    angle: 从标签几何和离散类别语义解释训练失败。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - visual_instruction_tuning
  - data_augmentation
  - data_preprocessing
  - visual_grounding
  expected_elements:
  - 机制: 图像空间变换需要同步更新区域与语言指代。
  - 应用: 变换坐标并丢弃失效指代，抽样渲染可视化对照。
  - 边界: 只同步框仍可能留下语义错误，如左右指代翻转。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_vit_resolution
  title: ViT分辨率翻倍的预算
  brief: ViT输入224升448，patch16不变；显存只有16GB，团队以为注意力只增加4倍。
  asks:
  - type: diagnosis
    angle: 估算 token 数、注意力矩阵与位置编码迁移成本。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - vision_transformer
  - transformer
  - multihead_attention
  - vlm
  expected_elements:
  - 机制: token数约4倍，完整注意力分数约16倍。
  - 应用: 核算patch数、位置编码适配和实际显存，再选裁剪或更省内核。
  - 边界: FlashAttention省IO与显存不消除所有算术增长。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2205.14135 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_rnn_detach
  title: 长序列 RNN 的状态和梯度
  brief: 沿 D2L 字符语言模型：训练文本分为长 32 的片段，hidden 跨片段传递，运行第 100 个片段时显存持续增长；采样器还会随机重排片段。
  asks:
  - type: diagnosis
    angle: 分别定位计算图增长与随机片段的状态污染。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - rnn
  - backpropagation
  - language_model
  - gradient_clipping
  expected_elements:
  - 机制: 不 detach 隐状态会连接跨片段计算图；随机片段不代表连续上下文。
  - 应用: 连续采样时截断梯度但保留状态值；随机采样时重置状态，记录梯度范数并按需裁剪。
  - 边界: detach 会截断跨片段依赖学习；梯度裁剪不能修复错误的采样/状态对应关系。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_attention_scale
  title: 高维注意力 logits 饱和
  brief: 沿 D2L scaled dot-product attention：Q 为 2×8×128×64，K/V 长 256；实现遗漏除以 sqrt(64)，同时给 padding 的 mask 填 0，注意力几乎
    one-hot。
  asks:
  - type: diagnosis
    angle: 推导张量形状并区分缩放与 mask 两个问题。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - attn_scaled_dot_product
  - multihead_attention
  - softmax
  - matrix_multiplication
  expected_elements:
  - 机制: QKᵀ 得 2×8×128×256；独立分量假设下点积方差随键维度增大，缩放缓解 softmax 饱和。
  - 应用: 除以 8，在 softmax 前将无效位置设为足够负值，并检查每行概率与 padding 权重。
  - 边界: 整行都被 mask 时可能出现 NaN；缩放推导的独立假设不意味着训练后 logits 必服从标准正态。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_causal_mask
  title: 训练能偷看答案的 Transformer
  brief: 改写 D2L Transformer 语言建模习题：decoder-only 序列长 1024，训练 loss=0.02，但逐 token 生成失败；实现用了双向 encoder mask，并未右移标签。
  asks:
  - type: diagnosis
    angle: 审计因果可见性与标签对齐并给最小泄漏测试。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - transformer
  - attn_scaled_dot_product
  - positional_encoding
  - language_model
  expected_elements:
  - 机制: 自回归位置 t 只能依赖已知前缀；未移位标签和双向注意力均可泄漏待预测 token。
  - 应用: 右移输入/标签并使用因果 mask，扰动未来 token 检查过去位置 logits 是否不变。
  - 边界: 低 teacher-forced loss 不证明自由生成质量；位置编码也不替代因果 mask。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_word_vectors
  title: 大模型分词与罕见词表示
  brief: 7B模型处理2000个新药名，每词被切成10个token；词表不可改，延迟预算1秒。
  asks:
  - type: application
    angle: 说明负采样降低什么成本，如何处理低频和未登录词。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - word_embedding
  - tokenization
  - subword_tokenization
  - word2vec
  expected_elements:
  - 机制: 子词缓解OOV但增加序列长度，不同于静态整词向量表。
  - 应用: 统计切分和任务误差，比较检索补充与域适配。
  - 边界: 更多子词不是语义更懂；改词表需处理新嵌入与再训练。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_bert_mask
  title: 把 BERT 当自由生成模型
  brief: 沿 D2L BERT：512 token 上限的双向编码器，客服要在 800 token 工单后续写 100 token；团队把最后一个隐藏向量接词表 softmax 循环生成。
  asks:
  - type: application
    angle: 比较预训练目标、可见上下文和目标任务。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - bert
  - masked_language_modeling
  - language_model
  - tokenization
  expected_elements:
  - 机制: BERT 的掩码预测使用左右上下文，不是标准左到右自回归训练；输入还受长度限制。
  - 应用: 按分类/抽取任务使用编码器，长工单分段聚合；需要续写时用适配生成目标的模型。
  - 边界: 重复填 MASK 可定义一种生成过程，但不能直接声称等价于训练好的自回归分布。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_rag_freshness
  title: 知识更新后 RAG 仍答旧政策
  brief: 改写 RAG 论文的检索加生成结构：10 万条公司政策段落，日更新一次，每次检索 top-5，答案需 2 秒内给出处；新政策已入库但检索仍返回旧版。
  asks:
  - type: diagnosis
    angle: 区分检索召回、索引新鲜度与生成器使用证据的问题。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - retrieval_augmented_generation
  - word_embedding
  - model_versioning
  - language_model
  expected_elements:
  - 机制: 参数记忆和外部检索记忆分离；索引、embedding 版本和过滤逻辑决定能否取得正确证据。
  - 应用: 记录查询、检索段落版本与答案引用，先检查新旧文档召回，再用固定正确上下文测试生成。
  - 边界: 增加 top-k 会增时延且可能引入冲突；有引用并不保证引用支持结论。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2005.11401 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_grid_value
  title: 工具代理长回合折扣选择
  brief: 网页代理最多30步才获终态奖励，折扣0.8，10%工具返回失败；不能给每步人工标签。
  asks:
  - type: diagnosis
    angle: 写出 Bellman 最优备份并解释 gamma 与终止条件。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - mdp
  - bellman_equation
  - return_discount
  - agent_loop
  expected_elements:
  - 机制: 延迟回报被折扣衰减，Bellman关系连接状态价值与后续回报。
  - 应用: 估算终态奖励权重，比较折扣、截断和终止判据。
  - 边界: 工具环境未必满足可观测MDP；奖励塑形可能改变目标。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2308.03688 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_grid_q
  title: 离线工具轨迹训练的分布外动作
  brief: 5000条离线工具轨迹只使用3种动作，上线有6种；真实付款不能用随机探索验证。
  asks:
  - type: diagnosis
    angle: 分开数据采集策略、训练目标及测试策略。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - mdp
  - exploration_exploitation
  - off_policy_learning
  - agent_tool_use
  expected_elements:
  - 机制: 离线数据未覆盖动作时价值或策略泛化不可靠。
  - 应用: 检查覆盖与行为差异，在沙箱中扩充受控轨迹并限制部署。
  - 边界: 离线回报高不证明新动作安全，不能拿真实副作用探索。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2308.03688 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_pg_baseline
  title: 策略梯度的高方差回报
  brief: 沿 Spinning Up policy gradient 的 reward-to-go 与 baseline 推导：机器人模拟每回合 200 步，每轮 20 条轨迹；奖励大多为 0、成功时 100，梯度方向波动很大。
  asks:
  - type: diagnosis
    angle: 说明为何可减状态基线并如何避免引入动作相关偏差。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - policy_gradient
  - expectation
  - return_discount
  - actor_critic
  expected_elements:
  - 机制: log-prob 梯度乘回报的估计方差高；与动作无关的状态基线在期望中不改变梯度。
  - 应用: 用 reward-to-go 和价值基线估计优势，区分策略与价值损失，记录方差及成功率。
  - 边界: 不恰当的动作相关基线或错误的梯度回流可引入偏差；有限样本改善不等于每轮必增益。
  difficulty: high
  source:
    type: engineering
    ref: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_gpu_graph_memory
  title: 反向图超出单卡显存
  brief: 改写 D2L 反向传播的显存习题：MLP 三层各 8192 宽，batch=128，单卡 16 GiB；前向能跑而 backward OOM，另有一张同规格卡可用。
  asks:
  - type: diagnosis
    angle: 将参数、梯度、优化器状态和激活分开估算。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - gpu_compute
  - backpropagation
  - activation_checkpointing
  - model_parallelism
  expected_elements:
  - 机制: 训练保存中间激活并分配梯度/优化器状态，推理内存不能直接当训练需求。
  - 应用: 测峰值并按张量估算，减小微批或检查点重算；跨卡分层时评估激活传输。
  - 边界: 两卡数据并行复制模型不解决模型自身放不下；检查点以额外计算换激活内存。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_ddp_small_batch
  title: 两卡训练不是两倍有效吞吐
  brief: 改写 D2L 反向传播的多 GPU 习题：两卡各处理 32 样本，模型含 1 亿 float32 参数；每步计算 20 ms，互联有效 10 GB/s，同事认为复制模型无需同步即可等价 batch=64。
  asks:
  - type: diagnosis
    angle: 从平均损失梯度定义推导同步需求并估算通信数量级。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - data_parallelism
  - gpu_compute
  - allreduce
  - minibatch_sgd
  expected_elements:
  - 机制: 同步数据并行复制模型，对各卡局部梯度聚合，才能实现全局批损失的梯度。
  - 应用: 核对 loss 归约和梯度缩放；仅 400 MB 梯度传输的简单带宽下界已约 40 ms，实际集体通信另有拓扑开销。
  - 边界: 下界不是 allreduce 的精确用时；BN、随机性与浮点归约使其不严格等同单卡大批。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_run_lineage
  title: 调参结果无法找到对应制品
  brief: 改写 ML Test Score 的可复现性检查：一周跑 40 次模型，最佳验证分 0.91，但文件均名 model.pt；预处理词表昨天更新，线上预测无法复现，只有一张旧 GPU 可回放。
  asks:
  - type: application
    angle: 定义一次实验必须绑定的输入与发布制品。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - experiment_tracking
  - model_versioning
  - validation_split
  - model_deployment
  expected_elements:
  - 机制: 指标必须关联代码、数据切分、配置及预处理/权重版本，否则无法定位性能变化来源。
  - 应用: 为每次 run 保存不可变标识、随机种子、环境和指标，发布绑定模型与特征处理版本并做固定样本回归。
  - 边界: 固定种子不保证跨硬件逐位一致；反复根据同一验证集选模型会造成选择偏差。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/abs/1607.00673 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_agent_webshop
  title: 购物 agent 的失败动作与预算
  brief: 改写 ReAct 的 WebShop 交互任务：只有 10 次工具调用和 30 秒预算，要买价格低于 50 美元、蓝色且 M 码的商品；搜索返回商品摘要，详情页却显示 M 码缺货。
  asks:
  - type: diagnosis
    angle: 解释思考、行动与观察循环，如何证明完成而非仅输出意图。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - agent_tool_use
  - language_model
  - experiment_tracking
  - browser_use
  expected_elements:
  - 机制: 工具观察可修正模型先验计划；摘要与详情冲突时需要以任务相关的可验证状态为准。
  - 应用: 记录每步调用与返回，核验库存、颜色、尺码和总价；预算不足时明确未完成而非捏造成功。
  - 边界: 论文中的模拟购物任务不意味着有真实支付授权；工具返回也可能不完整或含不可信指令。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2210.03629 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_logistic_stability
  title: 大词表交叉熵数值溢出
  brief: 7B模型词表128K，logits绝对值达到100，FP16训练出现NaN；不能直接改成全FP32。
  asks:
  - type: application
    angle: 分开数值稳定性和类别不平衡，不能把 NaN 归因于低正例率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - softmax
  - activation
  - cross_entropy
  - mixed_precision
  expected_elements:
  - 机制: 先减最大值与logsumexp避免指数溢出，混合精度需关键归约稳定。
  - 应用: 比较稳定交叉熵内核与FP32归约，查梯度和loss scaling。
  - 边界: loss scaling不能修复前向已发生的溢出。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_transfer_resolution
  title: 视觉基础模型冻结后的训练态
  brief: ResNet预训练骨干迁移只有200张图，batch2；权重冻结但BN running stats仍更新，对照ViT。
  asks:
  - type: application
    angle: 区分 requires_grad、训练模式和验证集选择。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - resnet
  - batch_norm
  - fine_tuning
