- id: scen_vit_resolution
  title: ViT 分辨率翻倍的预算
  brief: 改写 D2L ViT 的 img_size 习题：patch=16，输入从 224² 改为 448²，12 层、12 头、单卡 16 GiB，batch=32 原本刚能运行；位置嵌入长度固定。
  asks:
  - type: diagnosis
