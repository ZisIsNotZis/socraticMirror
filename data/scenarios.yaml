  - 应用: 核对 loss 归约和梯度缩放；仅 400 MB 梯度传输的简单带宽下界已约 40 ms，实际集体通信另有拓扑开销。
  - 边界: 下界不是 allreduce 的精确用时；BN、随机性与浮点归约使其不严格等同单卡大批。
