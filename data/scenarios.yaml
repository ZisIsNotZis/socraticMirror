  instantiates:
  - retrieval_augmented_generation
  - word_embedding
  - model_versioning
  - language_model
  expected_elements:
  - 机制: 参数记忆和外部检索记忆分离；索引、embedding 版本和过滤逻辑决定能否取得正确证据。
  - 应用: 记录查询、检索段落版本与答案引用，先检查新旧文档召回，再用固定正确上下文测试生成。
  - 边界: 增加 top-k 会增时延且可能引入冲突；有引用并不保证引用支持结论。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2005.11401 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_grid_value
  title: FrozenLake 扩大网格后不收敛
  brief: 改写 D2L value iteration 习题：把 4×4 FrozenLake 改 8×8，转移概率已知，滑动概率非零；gamma 从 0.9 改 1，仍用差值阈值 1e-6 判断收敛。
