    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - mdp
  - bellman_equation
  - value_iteration
  - return_discount
  expected_elements:
  - 机制: 价值迭代对每个状态最大化期望即时奖励加折扣后继价值，需按随机转移求和。
  - 应用: 比较 gamma=0、0.5、0.9 的策略及迭代数，明确吸收终点与终止状态价值。
  - 边界: gamma=1 时不能直接套用折扣收缩保证；有环且不终止的任务需额外条件。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_reinforcement-learning/value-iter.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_grid_q
  title: 只读回放的 Q-learning 没见过新动作
  brief: 改写 D2L Q-learning 的 epsilon 习题：8×8 FrozenLake，固定 10000 条由 epsilon=0 策略采集的转移；离线把 epsilon 改成 1，但不再与环境交互，成功率没有变化。
