  - language_model
  - tokenization
  expected_elements:
  - 机制: BERT 的掩码预测使用左右上下文，不是标准左到右自回归训练；输入还受长度限制。
  - 应用: 按分类/抽取任务使用编码器，长工单分段聚合；需要续写时用适配生成目标的模型。
  - 边界: 重复填 MASK 可定义一种生成过程，但不能直接声称等价于训练好的自回归分布。
