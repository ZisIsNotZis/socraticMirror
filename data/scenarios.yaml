# 来源任务/机制的教学改写；数字和脏约束为出题设定，非来源实测。
- id: scen_rank_deficient
  title: 重复特征让房价回归不可逆
  brief: 沿 D2L 线性回归的秩亏习题：训练矩阵 1000×4，其中面积一列同时以平方米和平方英尺出现；同事直接求 (XᵀX)⁻¹，报奇异矩阵。只能用 CPU，要求保留可解释系数。
  asks:
  - type: diagnosis
    angle: 如何验证秩亏并稳定求解，而不是只加一行逆矩阵调用？
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - linear_algebra
  - matrix_multiplication
  - linear_regression
  - svd
  expected_elements:
  - 机制: XᵀX 的秩受重复列限制；病态时正规方程会放大条件数。
  - 应用: 检查奇异值，用 SVD 最小范数解或有说明的正则；核对矩阵维数。
  - 边界: 最小范数只是在多解中选一解，不能从共线数据识别各特征独立因果贡献。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_linear-regression/linear-regression.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_pca_budget
  title: 不显式构造协方差的降维
  brief: 沿 scikit-learn PCA 的截断 SVD 实现：有 10000 条、2048 维图像特征；内存只剩 512 MiB，要输出 64 维特征用于近邻检索，有同事省掉中心化。
  asks:
  - type: diagnosis
    angle: 比较中心化后协方差特征分解与直接截断 SVD 的关系及内存。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - eigendecomposition
  - svd
  - matrix_multiplication
  - linear_algebra
  expected_elements:
  - 机制: 中心化 X 的右奇异向量对应 XᵀX 的特征向量，特征值与奇异值平方相关。
  - 应用: 以训练均值中心化，估算矩阵及工作区内存，采用分批或随机化截断算法。
  - 边界: 最大方差方向不保证最利于分类；不中心化得到的分解不是通常定义的 PCA。
  difficulty: high
  source:
    type: engineering
    ref: https://scikit-learn.org/stable/modules/decomposition.html#pca — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_robust_constant
  title: 长尾房价的常数基线
  brief: 改写 D2L 线性回归习题：先只拟合常数 b，观测房价为 100、110、120、130、1540（单位万元）；竞赛使用对数尺度误差，团队却按原价平方误差选基线。
  asks:
  - type: application
    angle: 推导平方损失与绝对损失最优常数，并解释目标尺度。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - calculus
  - linear_regression
  - maximum_likelihood
  - data_preprocessing
  expected_elements:
  - 机制: 平方损失导数给出均值；绝对损失给出中位数；不同噪声假设对应不同负对数似然。
  - 应用: 分别算出均值 400 与中位数 120，明确先做对数变换还是在原尺度拟合。
  - 边界: 原尺度最优不等于对数尺度最优；存在零或负目标时不能直接取对数。
  difficulty: medium
  source:
    type: exercise
    ref: https://d2l.ai/chapter_linear-regression/linear-regression.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_xor_mlp
  title: 两层线性网络仍学不会 XOR
  brief: 沿 D2L MLP 非线性示例：四个二进制输入的 XOR 标签各重复 100 次；网络 Linear(2,8) 接 Linear(8,1)，训练 200 轮仍不能全对。
  asks:
  - type: application
    angle: 从表达能力和梯度而非调大训练轮数入手定位。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - mlp
  - activation
  - logistic_regression
  - backpropagation
  expected_elements:
  - 机制: 无激活的仿射层复合仍是仿射映射；单一线性分界无法实现 XOR。
  - 应用: 隐藏层加入非线性，输出用二分类 logits 损失，检查四个输入的预测和梯度。
  - 边界: 表达能力足够不保证优化成功；饱和激活或不当初始化仍会学不动。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_gradient_graph
  title: 共享参数的梯度验算
  brief: 改写 D2L 反向传播习题：单批 16×32 输入，经共享 W 的两个分支求和后接标量损失；手写反向仅保留最后分支梯度，有限差分误差约 50%。
  asks:
  - type: diagnosis
    angle: 画出共享节点并说明梯度形状和累加位置。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - backpropagation
  - computational_graph
  - chain_rule
  - calculus
  - autodiff
  expected_elements:
  - 机制: 链式法则沿所有路径传播，同一 W 的总梯度为各路径贡献之和，形状与 W 一致。
  - 应用: 用小规模 float64 中心差分核验，清零旧梯度但不覆盖同一次图的分支贡献。
  - 边界: ReLU 拐点处数值差分未必匹配某个次梯度；训练时禁用随机层再检查。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_timing
  title: 数据翻倍后学习率日程失真
  brief: 改写 D2L minibatch SGD 的重复数据习题：原 10000 样本，batch=100，每 10 epoch 降学习率十倍；数据被逐条复制成 20000 条，同事保持 epoch 数比较 SGD
    与全批梯度下降。
  asks:
  - type: diagnosis
    angle: 区分经验目标、更新次数与墙钟时间，给出公平对照。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - gradient_descent
  - sgd
  - minibatch_sgd
  - learning_rate_schedule
  expected_elements:
  - 机制: 复制不改变平均经验损失，但改变每 epoch 的更新步数；小批梯度有抽样噪声。
  - 应用: 同时记录 optimizer steps、样本数和耗时，以相同更新或计算预算比较并重设 scheduler。
  - 边界: 重复样本不增加独立信息；按 epoch 或按 step 衰减不是等价实验。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_optimization/minibatch-sgd.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_adam_sparse
  title: 稀疏词向量的自适应步长
  brief: 沿 D2L Adam 的一二阶矩更新：词表 50000，embedding 维数 128，常见词每步更新而罕见词隔 1000 步才出现；从 SGD 改 Adam 后前十步损失跳变。
  asks:
  - type: diagnosis
    angle: 追踪前几步矩估计与偏差校正，而不是断言 Adam 总比 SGD 稳。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - adam
  - sgd
  - learning_rate_schedule
  - word_embedding
  expected_elements:
  - 机制: Adam 维护梯度一阶矩和平方梯度二阶矩，初始化为零导致早期偏差需校正。
  - 应用: 核对 beta、epsilon、偏差校正和学习率；对常见与罕见词分别记录更新范数。
  - 边界: Adam 不保证相同学习率下更好泛化；稀疏更新语义和优化器实现兼容性必须核验。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_optimization/adam.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_bn_small_batch
  title: 显存限制下的 BN 统计量
  brief: 改写 D2L BN 的训练/推理讨论：8 卡图像分类，每卡只能 batch=2；训练 loss 降低，验证时切 eval 后显著变差；有人建议累积 16 次梯度即可修复 BN。
  asks:
  - type: diagnosis
    angle: 先审计运行统计量、每卡统计与推理模式。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - batch_norm
  - minibatch_sgd
  - data_parallelism
  - layer_norm
  expected_elements:
  - 机制: BN 使用批统计并在推理使用运行统计；小批和跨卡统计范围会改变估计噪声。
  - 应用: 比对 train/eval 输出与运行均值方差，尝试同步 BN、冻结可靠统计或不依赖批维的归一化。
  - 边界: 梯度累积不会自动合并 BN 每次前向的统计量；batch=2 本身也不必然使所有卷积 BN 失效。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_convolutional-modern/batch-norm.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_house_leak
  title: 房价表格中的预处理泄漏
  brief: 沿 D2L 房价竞赛案例：1460 行训练记录，80 个原始字段，车库类别和面积有缺失；用五折选超参时，先在全量训练表做目标编码，再分折，线下分数异常好。
  asks:
  - type: diagnosis
    angle: 设计不读取留出标签的特征与验证流水线。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - train_test_split
  - validation_split
  - data_preprocessing
  - feature_engineering
  - cross_validation
  expected_elements:
  - 机制: 目标编码若见到验证标签会泄漏；预处理拟合也必须限定在训练折。
  - 应用: 每折单独拟合填补、类别词表及交叉拟合目标编码，独立保留最终测试集。
  - 边界: 无标签联合统计与目标泄漏风险不同；竞赛允许的传导式处理不必符合线上未知数据条件。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_shift_monitor
  title: 上线后词表和标签比例都变了
  brief: 改写 ML Test Score 的监控检查：客服分类器每分钟 1000 请求，部署两周后新产品工单占 30%，标签延迟 7 天，未知 token 比率从 1% 到 12%；不能立即重训。
  asks:
  - type: diagnosis
    angle: 区分输入漂移警报与性能已经下降的证据。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - distribution_shift
  - model_monitoring
  - model_deployment
  - data_preprocessing
  expected_elements:
  - 机制: 输入分布变化不自动等于条件标签关系变化；标签延迟使真实线上质量暂不可直接观测。
  - 应用: 监控未知词、缺失率、分群输出，保留版本与回放样本，待标签到齐做分时段验证。
  - 边界: 无标签漂移指标不能证明准确率下降；回滚旧模型也不保证适应新产品。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1607.00673 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_rare_fraud
  title: 99.5% 准确率的欺诈检测器
  brief: 沿 scikit-learn 不平衡分类评估：每天 100000 笔交易，500 笔欺诈；全判正常已有 99.5% accuracy，人工每天最多审核 1000 笔。
  asks:
  - type: application
    angle: 根据审核容量选阈值并用混淆矩阵量化漏报。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - precision_recall
  - accuracy
  - confusion_matrix
  - f1_score
  expected_elements:
  - 机制: accuracy 被多数类支配；precision 与 recall 的分母不同，阈值改变两者取舍。
  - 应用: 在验证集按 top-1000 或阈值计算 TP/FP/FN，报告召回和审核命中率。
  - 边界: F1 隐含等权且不直接表达审核成本；跨日期基础欺诈率变动会改变 precision。
  difficulty: medium
  source:
    type: engineering
    ref: https://scikit-learn.org/stable/modules/model_evaluation.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_calibrate
  title: 正确率不变却风险定价错误
  brief: 沿 scikit-learn 温度缩放例子：三分类模型准确率 85%，声称置信度 0.9 的 1000 条记录实际仅 700 条正确；另留出 2000 条校准数据。
  asks:
  - type: diagnosis
    angle: 解释为何提高概率可信度不一定提升 argmax 正确率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - model_calibration
  - accuracy
  - validation_split
  - softmax
  expected_elements:
  - 机制: 正温度缩放 logits 不改变类别排序；校准关注预测概率与经验频率的一致性。
  - 应用: 仅在独立校准集拟合温度，以可靠性图、Brier 或 log loss 检查留出集表现。
  - 边界: 温度缩放不能修复错误类别排序；总体校准掩盖分群偏差且漂移后可能失效。
  difficulty: high
  source:
    type: engineering
    ref: https://scikit-learn.org/stable/modules/calibration.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_perplexity_tokens
  title: 不同 tokenizer 的困惑度不能直比
  brief: 沿 D2L 语言模型：同一 10000 字符测试文本，模型 A 切成 5000 token，模型 B 为 8000 token；两者报告 token perplexity 18 与 12，团队欲宣布 B 更强。
  asks:
  - type: diagnosis
    angle: 将归一化单位与测试文本固定后再比较。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - perplexity
  - language_model
  - tokenization
  - cross_entropy
  expected_elements:
  - 机制: 困惑度为平均 token 负对数似然的指数，token 单位改变会改变分母。
  - 应用: 使用一致文本和切分协议，或转为每字节负对数似然并披露边界符处理。
  - 边界: 低困惑度不直接等于事实性或下游任务质量；不同支持集及未知词处理仍会妨碍比较。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_online
  title: 离线批量特征搬到在线失败
  brief: 改写 ML Test Score 的训练服务一致性检查：原先每晚批量给 100 万用户评分，改为单请求 50 ms 内响应；离线特征含次日聚合，线上只能读取截至当前的事件。
  asks:
  - type: diagnosis
    angle: 划定特征可用时间并验证训练和服务语义一致。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - batch_prediction
  - online_prediction
  - model_deployment
  - feature_engineering
  - latency
  expected_elements:
  - 机制: 批量和在线有不同新鲜度与延迟约束；未来聚合造成时间泄漏而非单纯推理性能差。
  - 应用: 按事件时间回放构造特征，抽样比对离线/在线值，测 p95/p99 并设超时降级。
  - 边界: 离线高分不证明线上有效；缓存能降延迟但可能损失新鲜度，不能缓存未来信息。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1607.00673 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_distill_edge
  title: 端侧压缩不是只看参数量
  brief: 改写蒸馏论文的集成到单模型任务：教师为 5 模型集成，学生要在 4 GiB 手机上运行，模型文件上限 50 MiB、单条 p95 低于 80 ms；只能用现有带标签训练集。
  asks:
  - type: diagnosis
    angle: 设计学生训练与真实端侧验收，不把压缩率当延迟加速率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - model_compression
  - knowledge_distillation
  - model_deployment
  - latency
  expected_elements:
  - 机制: 软目标包含类别间相对信息；温度与硬标签损失权重影响学生学习信号。
  - 应用: 混合软硬损失，比较相同数据下学生基线，实测设备峰值内存、尾延迟和分群质量。
  - 边界: 参数更少不必然更快；教师错误可被继承，未代表的端侧输入分布不能靠蒸馏修复。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1503.02531 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_beam_translation
  title: 翻译 beam 加宽反而偏短
  brief: 沿 D2L beam search：中英翻译最长输出 64 token，beam 从 1 改 8，单请求预算 200 ms；总 log 概率更优但译文常提前输出 EOS。
  asks:
  - type: application
    angle: 解释搜索目标、长度偏置和延迟，而不是只加宽 beam。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - beam_search
  - autoregressive_decoding
  - language_model
  expected_elements:
  - 机制: 自回归序列概率为条件概率乘积；直接求和 log 概率常偏好较短输出，beam 是近似搜索。
  - 应用: 核对 EOS 与长度处理，在验证集试长度归一化并同时测质量及耗时。
  - 边界: 更宽 beam 不保证任务指标提升；归一化改变目标而非证明找到了真实最优译文。
