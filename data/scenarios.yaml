- id: scen_wp1b_contexts
  title: 本地权限对象进入了模型提示
  brief: 上下文对象有100个客户token，摘要器误把其序列化进提示；模型窗口8K，工具列表动态变化。
  asks:
  - type: diagnosis
    angle: 解释机制，给出可验证实施与故障定位方案。
  - type: boundary
    angle: 指出该方案无法保证的性质。
  instantiates:
  - local_context
  - llm_context
  - context_compaction
  - mcp_tool_filter
  - least_privilege
  expected_elements:
  - 机制: 本地执行上下文不应自动暴露给模型，压缩与工具可见性分别管理。
  - 应用: 允许列表导出模型可见字段，压缩保留权限边界，按租户过滤工具。
  - 边界: 隐藏工具名不能取代服务端授权；摘要可能遗漏关键约束。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/context/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_tool_guard
  title: 工具护栏为何没有阻断付款
  brief: 输入护栏异步耗时300ms，但代理100ms就支付；输出护栏拦下回复时已扣款500元。
  asks:
  - type: diagnosis
    angle: 解释机制，给出可验证实施与故障定位方案。
  - type: boundary
    angle: 指出该方案无法保证的性质。
  instantiates:
  - tool_guardrail
  - input_guardrail
  - output_guardrail
  - guardrail_tripwire
  - guardrail_race
  expected_elements:
  - 机制: 输入、工具和输出护栏覆盖不同执行点，并行运行存在先行动后判决风险。
  - 应用: 副作用之前用阻塞式执行层检查，工具级校验参数权限，记录tripwire终止范围。
  - 边界: 输出护栏不能撤销副作用，护栏异常也不是原子事务。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/guardrails/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_kvquant
  title: KV量化省显存后长文退化
  brief: 32K合同服务将KV从FP16改低精度，显存省30%但尾部条款召回跌15点；校准只用短句。
  asks:
  - type: diagnosis
    angle: 解释机制，给出可验证实施与故障定位方案。
  - type: boundary
    angle: 指出该方案无法保证的性质。
  instantiates:
  - kv_cache_quantization
  - weight_quantization
  - activation_quantization
  - kv_cache
  expected_elements:
  - 机制: KV量化压缩运行态缓存，与权重量化目标不同且误差随访问模式变化。
  - 应用: 分开测权重与KV精度，按上下文长度与位置测质量、显存和延迟。
  - 边界: 节省显存不保证速度提升或所有长度质量不变。
  difficulty: high
  source:
    type: engineering
    ref: https://docs.vllm.ai/en/latest/features/quantization/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_dispatch
  title: 专家并行推理被网络吞掉
  brief: 8专家模型跨4机，每机2GPU；50Gbps链路在高并发时满载，token吞吐下降40%。
  asks:
  - type: diagnosis
    angle: 解释机制，给出可验证实施与故障定位方案。
  - type: boundary
    angle: 指出该方案无法保证的性质。
  instantiates:
  - moe_dispatch
  - expert_parallelism
  - inference_tensor_parallel
  - mixture_of_experts
  expected_elements:
  - 机制: 专家分发和结果聚合产生跨设备通信，张量并行有不同通信模式。
  - 应用: 测通信与计算占比、专家token分布，比较局部放置和并行切分。
  - 边界: 更多机器不保证线性加速；路由不均可能使平均带宽指标误导。
  difficulty: high
  source:
    type: engineering
    ref: https://docs.vllm.ai/en/latest/serving/parallelism_scaling/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_iteration
  title: 多轮后训练格式退化
  brief: SFT后做3轮偏好优化，结构化JSON合规从98%降到80%；原SFT把用户输入也计loss，只有200个留出题。
  asks:
  - type: diagnosis
    angle: 解释机制，给出可验证实施与故障定位方案。
  - type: boundary
    angle: 指出该方案无法保证的性质。
  instantiates:
  - iterative_posttraining
  - sft_loss_mask
  - direct_preference_optimization
  - rejection_sampling
  expected_elements:
  - 机制: 损失mask决定训练目标，多阶段更新能覆盖前阶段行为。
  - 应用: 分阶段留快照，修复mask后固定预算对照，拒绝采样保留质量而非只看长度。
  - 边界: 小留出集胜率有不确定性；筛选策略可引入新偏差。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 教学改写；数字与脏约束非来源实测。
