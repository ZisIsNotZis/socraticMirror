- id: scen_rank_deficient
  title: 嵌入矩阵重复方向与低秩适配
  brief: 本地离线7B模型做LoRA适配，32层宽4096、32头，B=1、长度512、bf16、checkpointing开、FlashAttention开；24GiB卡仅余0.5GiB。秩8与256在同一留出集误差均为12%，更新矩阵前8个奇异值占平方和99%。
  required_observables:
  - 24GiB仅余0.5GiB
  - 秩8与256误差均12%
  - 前8奇异值能量99%
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 在剩余显存内制定下一轮秩选择实验。
  - type: boundary
    angle: 只够训练一个新配置，你会把预算投给更高秩还是数据修订？
  instantiates:
  - linear_algebra
  - matrix_multiplication
  - svd
  - lora
  expected_elements:
  - 机制: 低秩矩阵乘积限定可更新子空间；奇异值反映方向退化。
  - 应用: 比较更新矩阵谱、训练与验证误差，固定预算扫秩。
  - 边界: 嵌入共线不直接说明任务不可解；更大秩不保证泛化。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_pca_budget
  title: 检索嵌入低秩压缩
  brief: 离线CPU检索库有10000条2048维float32向量，要输出64维表示；进程内存上限512MiB。原空间召回@10为90%，压缩后为40%；同一文本经查询接口和入库接口所得64维向量余弦为0.05，原空间为1。
  required_observables:
  - 10000×2048 float32
  - 64维
  - 512MiB
  - 同文余弦0.05
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计一套不超内存的压缩检索修复流程。
  - type: boundary
    angle: 只能保留一套投影，你如何选择拟合数据而不牺牲留出评估？
  instantiates:
  - svd
  - matrix_multiplication
  - linear_algebra
  - dense_retrieval
  expected_elements:
  - 机制: SVD得到低秩子空间，查询与文档必须在可比较空间计算相似度。
  - 应用: 训练集拟合共享投影，测检索召回及工作区内存。
  - 边界: 保留大方差不保证保留语义相关性；投影不能混用。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2004.04906 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_robust_constant
  title: 预训练长尾样本主导损失
  brief: 300B token语料的抽样审计中，1%样本贡献40%总交叉熵；其中既有不可解析的重复符号串，也有语法正确的罕见代码。只剩两天训练预算，无法重爬语料。
  required_observables:
  - 1%贡献40%loss
  - 符号串与罕见代码并存
  - 两天
  - 不能重爬
  symptom_shape: degradation
  asks:
  - type: application
    angle: 制定剩余两天内的语料过滤方案。
  - type: boundary
    angle: 只能人工审计一类高loss样本，你先选哪类以降低误删代价？
  instantiates:
  - calculus
  - maximum_likelihood
  - data_preprocessing
  - cross_entropy
  expected_elements:
  - 机制: 交叉熵对应token似然，高loss可能是噪声也可能是困难域。
  - 应用: 按域和样本质量分层审计，比较过滤前后留出损失。
  - 边界: 删除难例可能破坏稀有能力，均值loss不足以判断质量。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_xor_mlp
  title: 前馈改版后的表达能力退化
  brief: 本地离线7B decoder继续训练，32层32层宽4096、32头，B=1、长度2048、bf16、checkpointing与FlashAttention均开。一次前馈模块改版后代码留出正确率由40%降到30%，同预算旧版仍40%；改版模块的输入沿任意两点插值时，输出等于两输出插值，误差低于1e-5。只够两组2000步消融。
  required_observables:
  - 插值误差低于1e-5
  - 40%到30%
  - 两组2000步
  symptom_shape: degradation
  asks:
  - type: application
    angle: 安排两组能检验前馈表达能力的消融。
  - type: boundary
    angle: 只能保留旧版或改版上线，你依据什么证据承担相应代价？
  instantiates:
  - mlp
  - activation
  - backpropagation
  - swiglu
  expected_elements:
  - 机制: 纯仿射复合仍是仿射映射，门控非线性改变表达能力。
  - 应用: 对齐参数量和token预算比较，有梯度不等于有足够表达能力。
  - 边界: 容量不足与优化失败不能只凭训练loss区分。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_gradient_graph
  title: 共享参数的梯度验算
  brief: CPU float64梯度验算：X为16×32全1，W为32×1，两条相同分支各计算XW，再将两输出所有元素求和为L。有限差分每个W元素得32，手写反向得16；无随机层。只能改一个反向节点。
  required_observables:
  - X全1为16×32
  - 两个相同分支
  - 差分32而反向16
  - float64
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 定位应修改的反向节点。
  - type: boundary
    angle: 预算只够维护数值差分或解析单测之一，你保留哪个检查？
  instantiates:
  - backpropagation
  - computational_graph
  - chain_rule
  - calculus
  - autodiff
  expected_elements:
  - 机制: 链式法则沿所有路径传播，同一 W 的总梯度为各路径贡献之和，形状与 W 一致。
  - 应用: 用小规模 float64 中心差分核验，清零旧梯度但不覆盖同一次图的分支贡献。
  - 边界: ReLU 拐点处数值差分未必匹配某个次梯度；训练时禁用随机层再检查。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_timing
  title: 数据翻倍后学习率日程失真
  brief: 10000样本逐条复制成20000，均值损失目标不变；B=100，每10 epoch学习率除10。两组都训练10 epoch后，复制组已更新2000次，原组1000次；只能再跑与原组相同1000步的对照。
  required_observables:
  - 10000到20000
  - B=100
  - 10epoch衰减
  - 1000步对照
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 重设复制组的日程以完成公平对照。
  - type: boundary
    angle: 只允许按步数或按遍历次数对齐一种预算，你选哪种来回答优化效率问题？
  instantiates:
  - gradient_descent
  - sgd
  - minibatch_sgd
  - learning_rate_schedule
  expected_elements:
  - 机制: 复制不改变平均经验损失，但改变每 epoch 的更新步数；小批梯度有抽样噪声。
  - 应用: 同时记录 optimizer steps、样本数和耗时，以相同更新或计算预算比较并重设 scheduler。
  - 边界: 重复样本不增加独立信息；按 epoch 或按 step 衰减不是等价实验。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_optimization/minibatch-sgd.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_adam_sparse
  title: 稀疏词向量的自适应步长
  brief: 词表50000、维128的嵌入训练单元测试，float32、B=1、无注意力与checkpointing。对一个坐标连续输入梯度1，Adam的β1=0.9、β2=0.999、ε=1e-8、学习率1e-3；第1步参数改变量实测0.003162，成熟阶段约0.001。真实数据罕见词每1000步出现一次。
  required_observables:
  - 首步0.003162
  - β1=.9与β2=.999
  - 成熟步.001
  - 罕见词间隔1000
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 设计修复首步尺度偏差的验证。
  - type: boundary
    angle: 只有一次重训预算，你先修优化器还是先调学习率？
  instantiates:
  - adam
  - sgd
  - learning_rate_schedule
  - word_embedding
  expected_elements:
  - 机制: Adam 维护梯度一阶矩和平方梯度二阶矩，初始化为零导致早期偏差需校正。
  - 应用: 核对 beta、epsilon、偏差校正和学习率；对常见与罕见词分别记录更新范数。
  - 边界: Adam 不保证相同学习率下更好泛化；稀疏更新语义和优化器实现兼容性必须核验。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_optimization/adam.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_bn_small_batch
  title: 显存限制下的 BN 统计量
  brief: 本地4卡ResNet-50继续训练，float32、每卡B=2、224平方图像，checkpointing关，无注意力；每卡只余1GiB。固定验证图在train模式输出类A概率0.8，eval模式0.4，连续20轮都是稳定差距而非尖峰；末层BN的运行均值0、方差1，当前域输入均值2、方差1。
  required_observables:
  - 每卡B=2
  - 剩余1GiB
  - train .8/eval .4
  - 运行均值0与当前均值2
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 在显存不增加下修订验证与归一化方案。
  - type: boundary
    angle: 只够做一次同步BN或统计量重估实验，你先选哪个？
  instantiates:
  - batch_norm
  - minibatch_sgd
  - data_parallelism
  - layer_norm
  expected_elements:
  - 机制: BN 使用批统计并在推理使用运行统计；小批和跨卡统计范围会改变估计噪声。
  - 应用: 比对 train/eval 输出与运行均值方差，尝试同步 BN、冻结可靠统计或不依赖批维的归一化。
  - 边界: 梯度累积不会自动合并 BN 每次前向的统计量；batch=2 本身也不必然使所有卷积 BN 失效。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_convolutional-modern/batch-norm.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_house_leak
  title: 预训练去污染中的划分泄漏
  brief: 10万原始指令各有5个改写版本，50万条记录随机80/20划分后验证80%，外部独立题60%；验证中抽100条有67条能在训练集找到近重复。作者信息缺失，不能重新标注。
  required_observables:
  - 5改写
  - 80/20划分
  - 近重复67/100
  - 不能重标
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 重建可用的留出集。
  - type: boundary
    angle: 只能牺牲留出集规模或放宽去重阈值，你如何取舍？
  instantiates:
  - train_test_split
  - validation_split
  - data_preprocessing
  - data_deduplication
  expected_elements:
  - 机制: 同源改写跨划分导致泄漏。
  - 应用: 按原始样本和近重复簇分组后划分，独立保留污染审计集。
  - 边界: 去重阈值不证明语义无泄漏；不可把新验证分直接与旧分比较。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_shift_monitor
  title: 模型迁移到新域后失准
  brief: 本地客服上线新地区，拒答率5%变25%，方言占30%；同一固定探针在新旧服务拒答一致。日志不能保留请求原文，也不能出网；可在本地由授权审核员查看一次抽样。
  required_observables:
  - 拒答5%到25%
  - 方言30%
  - 固定探针一致
  - 原文不留存不出网
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计能区分输入迁移与策略变化的本地评估。
  - type: boundary
    angle: 只能审核方言或非方言一层，你先审核哪层？
  instantiates:
  - distribution_shift
  - model_calibration
  - model_deployment
  - data_preprocessing
  expected_elements:
  - 机制: 域变化影响输入和任务分布，旧校准不自动适用。
  - 应用: 做本地脱敏分层评测，固定模板与版本对比。
  - 边界: 仅观察拒答率不能区分安全策略变化与理解能力下降。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_rare_fraud
  title: 安全分类头的高准确率陷阱
  brief: 10000条请求中50条攻击，全放行的护栏准确率99.5%。本地审核每天最多100条；候选阈值A触发100条含40次攻击，阈值B触发500条含48次攻击，未审核默认不放行会误拒普通用户。
  required_observables:
  - 50/10000攻击
  - 每日审核100
  - A为40/100
  - B为48/500
  symptom_shape: silent
  asks:
  - type: application
    angle: 给出满足审核容量的上线阈值策略。
  - type: boundary
    angle: 扩容不可能时，你优先漏报风险还是普通用户可用性，如何落地这一选择？
  instantiates:
  - precision_recall
  - accuracy
  - f1_score
  - guardrails
  expected_elements:
  - 机制: 类别失衡使准确率掩盖漏报。
  - 应用: 明确阳性定义，计算precision/recall/F1并扫描阈值。
  - 边界: 指标随基准患病率变化，离线高分不证明对新攻击可靠。
  difficulty: medium
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/safety/ — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_calibrate
  title: 正确率不变却风险定价错误
  brief: 三分类模型准确率85%，置信度为0.9的一组1000条记录只有700条正确；有独立2000条带标签校准集和未使用测试集。业务按置信度决定是否人工复核，不能改变类别排序。
  required_observables:
  - 0.9组700/1000
  - 独立2000校准
  - 类别排序不得改
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 修订供人工复核使用的概率输出。
  - type: boundary
    angle: 只够做一次总体温度拟合或分群审计，你优先哪项？
  instantiates:
  - model_calibration
  - accuracy
  - validation_split
  - softmax
  expected_elements:
  - 机制: 正温度缩放 logits 不改变类别排序；校准关注预测概率与经验频率的一致性。
  - 应用: 仅在独立校准集拟合温度，以可靠性图、Brier 或 log loss 检查留出集表现。
  - 边界: 温度缩放不能修复错误类别排序；总体校准掩盖分群偏差且漂移后可能失效。
  difficulty: high
  source:
    type: engineering
    ref: https://scikit-learn.org/stable/modules/calibration.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_perplexity_tokens
  title: 不同 tokenizer 的困惑度不能直比
  brief: 相同10000个ASCII字符测试串，含相同边界处理且无未知词；A切5000 token、PPL18，B切8000 token、PPL12。只能用已存逐token logprob出一份发布比较，不能重跑。
  required_observables:
  - 10000 ASCII字节
  - A5000/PPL18
  - B8000/PPL12
  - 不可重跑
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 用现有记录制定统一单位的比较结论。
  - type: boundary
    angle: 只能以压缩率或业务问答质量作发布主指标，你会如何选取可支持的主张？
  instantiates:
  - perplexity
  - language_model
  - tokenization
  - cross_entropy
  expected_elements:
  - 机制: 困惑度为平均 token 负对数似然的指数，token 单位改变会改变分母。
  - 应用: 使用一致文本和切分协议，或转为每字节负对数似然并披露边界符处理。
  - 边界: 低困惑度不直接等于事实性或下游任务质量；不同支持集及未知词处理仍会妨碍比较。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_batch_online
  title: prefill批处理拖慢短请求
  brief: 本地一张80GiB卡推理7B，32层宽4096、32Q/8KV头、头维128，bf16、checkpointing不适用、FlashAttention开；B上限32，输入320与32000 token混合，输出均32。短请求P99为8秒，SLO2秒；监控显示短请求等待长prefill占6秒，不能增卡。
  required_observables:
  - 输入320/32000
  - B≤32
  - P99=8s
  - 等待prefill6s
  - SLO2s
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 改造单卡调度以保护短请求SLO。
  - type: boundary
    angle: 预算只够实现分块prefill或增大批量，你先实现哪个？
  instantiates:
  - prefill_decode
  - continuous_batching
  - latency
  - throughput
  expected_elements:
  - 机制: prefill与decode资源模式不同，批处理在吞吐与尾延迟间权衡。
  - 应用: 记录TTFT和token间延迟，设token预算与准入。
  - 边界: 单看每秒token数不能保证用户延迟。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2309.06180 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_distill_edge
  title: 端侧压缩不是只看参数量
  brief: 教师为5模型集成，学生用于不联网的本地4GiB手机；文件上限50MiB、单条p95<80ms，仅可用现有带标签训练集离线取得教师输出。候选学生float32权重2000万，实测p95为100ms，峰值300MiB。
  required_observables:
  - 离线手机4GiB
  - 50MiB
  - 80ms
  - 20M float32
  - 100ms
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定满足端侧验收的学生压缩训练方案。
  - type: boundary
    angle: 只能优先做量化或蒸馏，你先选哪个以解除硬阻塞？
  instantiates:
  - model_compression
  - knowledge_distillation
  - model_deployment
  - latency
  expected_elements:
  - 机制: 软目标包含类别间相对信息；温度与硬标签损失权重影响学生学习信号。
  - 应用: 混合软硬损失，比较相同数据下学生基线，实测设备峰值内存、尾延迟和分群质量。
  - 边界: 参数更少不必然更快；教师错误可被继承，未代表的端侧输入分布不能靠蒸馏修复。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1503.02531 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_beam_translation
  title: 翻译 beam 加宽反而偏短
  brief: 本地离线翻译服务输出最多64 token，预算200ms；同一批句子beam1为80ms、beam8为260ms。beam8选出短译文总logprob=-8，完整译文=-12；参考长度约40词，短译文仅10词且漏掉否定句。
  required_observables:
  - 64token
  - 200ms
  - beam8 260ms
  - 短-8完整-12
  symptom_shape: bias
  asks:
  - type: application
    angle: 修订满足时延的解码目标与配置。
  - type: boundary
    angle: 只准上线一种beam宽度，你如何在漏译与时延间取舍？
  instantiates:
  - beam_search
  - autoregressive_decoding
  - language_model
  expected_elements:
  - 机制: 自回归序列概率为条件概率乘积；直接求和 log 概率常偏好较短输出，beam 是近似搜索。
  - 应用: 核对 EOS 与长度处理，在验证集试长度归一化并同时测质量及耗时。
  - 边界: 更宽 beam 不保证任务指标提升；归一化改变目标而非证明找到了真实最优译文。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-modern/beam-search.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_lenet_shapes
  title: ResNet与ViT的小目标信息损失
  brief: 本地离线端侧2GiB内存，输入224平方图像中药片宽4像素；骨干连续5次3×3卷积、stride2、padding1。最终7×7特征对药片有无给出相同响应；不能整幅升到4K，但允许裁剪。
  required_observables:
  - '224'
  - 药片4像素
  - 五次stride2
  - 2GiB
  - 不可4K
  symptom_shape: degradation
  asks:
  - type: application
    angle: 设计保留药片证据的输入方案。
  - type: boundary
    angle: 只能提升全图分辨率或做局部裁剪，你选哪一个满足端侧约束？
  instantiates:
  - convolution
  - cnn
  - padding_stride
  - pooling
  expected_elements:
  - 机制: 下采样降低空间分辨率，局部信息可能不可恢复。
  - 应用: 比较分块、裁剪、多尺度与保留高分辨率特征。
  - 边界: 放大输出特征图无法恢复已丢失信号；更多参数未必解决采样损失。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_crowded_nms
  title: 视觉大模型定位评估的重复框
  brief: 离线VLM定位100张货架图，每图3个候选框；共300框中有100对IoU>.9，40张严重遮挡。标注只覆盖主要物体，未覆盖的小物体也被算法检出；只够人工复核20张。
  required_observables:
  - 100图300框
  - 100对IoU>.9
  - 40遮挡
  - 标签不全
  - 复核20图
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 制定可验证的定位误差审计方案。
  - type: boundary
    angle: 只能优先去重或补标一项，你如何决定？
  instantiates:
  - visual_grounding
  - object_detection
  - vlm
  - robustness
  expected_elements:
  - 机制: 定位质量不能只看是否覆盖，重复与漏标影响度量。
  - 应用: 明确匹配规则并审计遮挡、重复和漏标，人工抽样核验。
  - 边界: 低分可能来自标注不全；更密集输出不等于理解更好。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_segmentation_crop
  title: 视觉指令数据增广破坏指代
  brief: 500张带框指令图做裁剪增广；原图1000×1000中框[600,100,800,300]，裁剪窗口[500,0,1000,500]后预览仍画在[600,100,800,300]，框越过新图右界。20%问题用左右方位指代，不能重标整批。
  required_observables:
  - 框坐标
  - 裁剪窗口
  - 20%方位指代
  - 不能整批重标
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 修复这批增广样本的监督。
  - type: boundary
    angle: 只能自动保留坐标可修样本或人工修全部方位指代，你选哪条路线？
  instantiates:
  - visual_instruction_tuning
  - data_augmentation
  - data_preprocessing
  - visual_grounding
  expected_elements:
  - 机制: 图像空间变换需要同步更新区域与语言指代。
  - 应用: 变换坐标并丢弃失效指代，抽样渲染可视化对照。
  - 边界: 只同步框仍可能留下语义错误，如左右指代翻转。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_vit_resolution
  title: ViT分辨率翻倍的预算
  brief: 本地ViT-B/16训练，12层宽768、12头，B=8、bf16、checkpointing关、FlashAttention关；16GiB卡224输入峰值5GiB，其中注意力分数相关张量约0.2GiB。改448后报CUDA
    out of memory；patch16不变，需保留细粒度目标。
  required_observables:
  - 224→448
  - patch16
  - B8 bf16
  - 无checkpoint/flash
  - 16GiB
  - 分数0.2GiB
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定能保留细目标的单卡训练方案。
  - type: boundary
    angle: 只能开省显存内核或缩回224，你如何选择并接受代价？
  instantiates:
  - vision_transformer
  - transformer
  - multihead_attention
  - vlm
  expected_elements:
  - 机制: token数约4倍，完整注意力分数约16倍。
  - 应用: 核算patch数、位置编码适配和实际显存，再选裁剪或更省内核。
  - 边界: FlashAttention省IO与显存不消除所有算术增长。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2205.14135 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_rnn_detach
  title: 长序列 RNN 的状态和梯度
  brief: 本地单层RNN宽1024，float32训练，B=32、片段长32，无注意力、checkpointing关。每个新片段前向后记录图保存张量，约多4MiB，第100段比第1段多约396MiB；随机重排片段时同句首输出也随前一段改变。内存预算只余128MiB。
  required_observables:
  - 每段4MiB
  - 100段396MiB
  - B32/T32/H1024
  - 随机重排
  - 余128MiB
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 修订片段之间的状态管理。
  - type: boundary
    angle: 只能保留32步截断梯度或100段全回传，你在128MiB余量下选哪种？
  instantiates:
  - rnn
  - backpropagation
  - language_model
  - gradient_clipping
  expected_elements:
  - 机制: 不 detach 隐状态会连接跨片段计算图；随机片段不代表连续上下文。
  - 应用: 连续采样时截断梯度但保留状态值；随机采样时重置状态，记录梯度范数并按需裁剪。
  - 边界: detach 会截断跨片段依赖学习；梯度裁剪不能修复错误的采样/状态对应关系。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_attention_scale
  title: 高维注意力 logits 饱和
  brief: 局部注意力单元训练测试，B=2、8头、Q长128、KV长256、头维64、bf16，非完整模型，checkpointing和FlashAttention关。Q/K分量样本均值0方差1；softmax前logits标准差约8、极值±40，一行最大与次大差16，最大权重>.999；padding位置也有非零权重。改动不得改变有效token语义。
  required_observables:
  - Q2×8×128×64
  - KV长256
  - std8
  - 首两差16
  - padding非零
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 修订该单元的注意力计算。
  - type: boundary
    angle: 只够加一条回归测试，你优先测填充不变性还是长序列吞吐？
  instantiates:
  - attn_scaled_dot_product
  - multihead_attention
  - softmax
  - matrix_multiplication
  expected_elements:
  - 机制: QKᵀ 得 2×8×128×256；独立分量假设下点积方差随键维度增大，缩放缓解 softmax 饱和。
  - 应用: 除以 8，在 softmax 前将无效位置设为足够负值，并检查每行概率与 padding 权重。
  - 边界: 整行都被 mask 时可能出现 NaN；缩放推导的独立假设不意味着训练后 logits 必服从标准正态。
  difficulty: high
  source:
    type: engineering
    ref: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_causal_mask
  title: 低训练损失与前缀不变性冲突
  brief: 本地decoder训练，6层宽512、8头，B=4、长1024、bf16，checkpointing关、FlashAttention关；teacher-forced loss=.02。自由续写在提示结束后逐字重复提示最后一词。固定前缀只替换后半段，前半段对应logits明显改变；同样测试已训练正常模型不变。只可用现有token缓存重训。
  required_observables:
  - loss .02
  - 后缀扰动改变前缀logits
  - 对照不变
  - 现有缓存
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 设计修复并验证自回归训练合法性的流程。
  - type: boundary
    angle: 只够重训一次，你先修可见性还是先换位置编码？
  instantiates:
  - transformer
  - attn_scaled_dot_product
  - positional_encoding
  - language_model
  expected_elements:
  - 机制: '未来扰动改变过去logits违反因果可见性；标签对齐错误可共存，但不能仅据此断言未右移。'
  - 应用: 右移输入/标签并使用因果 mask，扰动未来 token 检查过去位置 logits 是否不变。
  - 边界: 低 teacher-forced loss 不证明自由生成质量；位置编码也不替代因果 mask。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_word_vectors
  title: 大模型分词与罕见词表示
  brief: 本地离线7B服务词表冻结，2000个新药名平均每词10个子词，普通词平均2个；每请求20药名，仅药名已200token，实测首token1.4s而预算1s。有旧静态word2vec表但新药名均无整词条目；不得改词表。
  required_observables:
  - 2000药名10子词
  - 每请求20
  - 1.4s/1s
  - 词表冻结
  - 静态表无条目
  symptom_shape: degradation
  asks:
  - type: application
    angle: 设计不改词表的药名处理方案。
  - type: boundary
    angle: 只够维护检索词典或做域适配一项，你优先哪项？
  instantiates:
  - word_embedding
  - tokenization
  - subword_tokenization
  - word2vec
  expected_elements:
  - 机制: 子词缓解OOV但增加序列长度，不同于静态整词向量表。
  - 应用: 统计切分和任务误差，比较检索补充与域适配。
  - 边界: 更多子词不是语义更懂；改词表需处理新嵌入与再训练。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_bert_mask
  title: 把 BERT 当自由生成模型
  brief: 本地不联网客服只有512token上限的BERT编码器，要处理800token工单并续写100token。验收输入在第700token才出现关键金额；截取前512后答案漏金额，现有100条测试可用，无预算重新预训练。
  required_observables:
  - 上限512
  - 工单800
  - 金额在700
  - 续写100
  - 无预训练预算
  symptom_shape: degradation
  asks:
  - type: application
    angle: 制定可交付的客服输出方案。
  - type: boundary
    angle: 只能部署分段抽取或追加生成模型一项，你如何缩小承诺范围？
  instantiates:
  - bert
  - masked_language_modeling
  - language_model
  - tokenization
  expected_elements:
  - 机制: BERT 的掩码预测使用左右上下文，不是标准左到右自回归训练；输入还受长度限制。
  - 应用: 按分类/抽取任务使用编码器，长工单分段聚合；需要续写时用适配生成目标的模型。
  - 边界: 重复填 MASK 可定义一种生成过程，但不能直接声称等价于训练好的自回归分布。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_rag_freshness
  title: 知识更新后 RAG 仍答旧政策
  brief: 云端内部RAG可访问政策库但不能访问公网；10万段每日更新，top5、2s内需附出处。新版政策v2已能按ID读取；相同查询top5全为v1；强制提供v2上下文时生成器答对并引用v2。不允许重训生成器。
  required_observables:
  - v2按ID可读
  - top5全v1
  - 强制v2答对
  - 2s
  - 不重训
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定2秒内能生效的知识更新修复方案。
  - type: boundary
    angle: 只够重建索引或提高top-k，你先改哪处？
  instantiates:
  - retrieval_augmented_generation
  - word_embedding
  - model_versioning
  - language_model
  expected_elements:
  - 机制: 参数记忆和外部检索记忆分离；索引、embedding 版本和过滤逻辑决定能否取得正确证据。
  - 应用: 记录查询、检索段落版本与答案引用，先检查新旧文档召回，再用固定正确上下文测试生成。
  - 边界: 增加 top-k 会增时延且可能引入冲突；有引用并不保证引用支持结论。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2005.11401 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_grid_value
  title: 工具代理长回合折扣选择
  brief: 网页代理一条任务需30次工具动作，只有成功终态奖励1，γ=.8；每次工具独立10%失败，任一次失败即终止且奖励0。不能人工标每步，最多30次调用。当前成功轨迹开头的折扣回报接近.001。
  required_observables:
  - 30动作
  - γ.8
  - 独立失败10%
  - 失败终止
  - 无逐步标签
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 重设价值目标以避免长任务信号被过度压低。
  - type: boundary
    angle: 只允许提高折扣或引入可验证子目标奖励，你优先哪项？
  instantiates:
  - mdp
  - bellman_equation
  - return_discount
  - agent_loop
  expected_elements:
  - 机制: 延迟回报被折扣衰减，Bellman关系连接状态价值与后续回报。
  - 应用: 估算终态奖励权重，比较折扣、截断和终止判据。
  - 边界: 工具环境未必满足可观测MDP；奖励塑形可能改变目标。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2308.03688 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_grid_q
  title: 离线工具轨迹训练的分布外动作
  brief: 有5000条离线工具轨迹只覆盖3种动作，上线接口提供6种；未见的付款动作被模型估值最高，但离线文件没有其回报记录。真实账户不能随机探索，允许无资金沙箱，部署截止前仅能收集500条新轨迹。
  required_observables:
  - 5000轨迹3/6动作
  - 付款无回报记录
  - 真实不可探索
  - 沙箱500条
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 制定这次上线的动作准入策略。
  - type: boundary
    angle: 500条沙箱预算优先补新动作还是复测旧动作，你如何分配？
  instantiates:
  - mdp
  - exploration_exploitation
  - off_policy_learning
  - agent_tool_use
  expected_elements:
  - 机制: 离线数据未覆盖动作时价值或策略泛化不可靠。
  - 应用: 检查覆盖与行为差异，在沙箱中扩充受控轨迹并限制部署。
  - 边界: 离线回报高不证明新动作安全，不能拿真实副作用探索。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2308.03688 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_pg_baseline
  title: 策略梯度的高方差回报
  brief: 模拟机器人每回合200步，每轮20条轨迹，成功终奖100其余0；固定策略独立成功率5%，γ=1。相邻轮成功轨迹数0、2、0、1时，平均回报0、10、0、5，梯度范数随之出现峰谷；不能增加轨迹数。
  required_observables:
  - 20轨迹
  - 5%成功
  - 终奖100
  - γ1
  - 不能扩样
  symptom_shape: spike
  asks:
  - type: diagnosis
    angle: 设计降低这轮策略梯度估计方差的更新方案。
  - type: boundary
    angle: 只能先实现状态价值基线或增加重复更新，你选哪项？
  instantiates:
  - policy_gradient
  - expectation
  - return_discount
  - actor_critic
  expected_elements:
  - 机制: log-prob 梯度乘回报的估计方差高；与动作无关的状态基线在期望中不改变梯度。
  - 应用: 用 reward-to-go 和价值基线估计优势，区分策略与价值损失，记录方差及成功率。
  - 边界: 不恰当的动作相关基线或错误的梯度回流可引入偏差；有限样本改善不等于每轮必增益。
  difficulty: high
  source:
    type: engineering
    ref: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_gpu_graph_memory
  title: 四层MLP的训练状态显存预算
  brief: 本地单卡16GiB训练四层16384→16384的无偏置MLP，ReLU，B=128、float32、checkpointing关，无注意力。只预分配权重和两个float32 Adam状态，无其他常驻大张量；前向完成，反向为全部权重分配梯度时报CUDA
    out of memory。另有一张16GiB卡但互联慢。
  required_observables:
  - 四层16384方阵
  - B128 fp32
  - 两个Adam状态
  - 16GiB
  - 反向OOM
  symptom_shape: crash
  asks:
  - type: diagnosis
    angle: 制定可在现有两卡完成训练的内存方案。
  - type: boundary
    angle: 只能改激活检查点或分片参数状态，你先选哪项？
  instantiates:
  - gpu_compute
  - backpropagation
  - activation_checkpointing
  - model_parallelism
  expected_elements:
  - 机制: '四层方阵权重4GiB、两份Adam状态8GiB，反向梯度另4GiB；激活很小但峰值仍越过16GiB。'
  - 应用: '以张量账本与实测峰值决定参数/梯度/优化器分片，跨卡分层时评估慢互联代价。'
  - 边界: '检查点主要节省激活，不能消除16GiB常驻训练状态；复制式数据并行也不解决单副本超预算。'
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_ddp_small_batch
  title: 两卡训练不是两倍有效吞吐
  brief: 本地两卡float32训练1亿参数模型，每卡B32，每步局部计算20ms，checkpointing关，无注意力。有效单向互联10GB/s，梯度无压缩且不与计算重叠；实测同步步约60ms，不能换网络。两卡需优化同一个全局B64均值损失。
  required_observables:
  - 100M fp32
  - B32每卡
  - 20ms
  - 10GB/s
  - 不重叠
  - 全局B64
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 修订训练配置以提高有效吞吐且保持全局目标。
  - type: boundary
    angle: 只能加梯度累积或异步独立更新，你选哪项？
  instantiates:
  - data_parallelism
  - gpu_compute
  - allreduce
  - minibatch_sgd
  expected_elements:
  - 机制: 同步数据并行复制模型，对各卡局部梯度聚合，才能实现全局批损失的梯度。
  - 应用: 核对 loss 归约和梯度缩放；仅 400 MB 梯度传输的简单带宽下界已约 40 ms，实际集体通信另有拓扑开销。
  - 边界: 下界不是 allreduce 的精确用时；BN、随机性与浮点归约使其不严格等同单卡大批。
  difficulty: high
  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_run_lineage
  title: 调参结果无法找到对应制品
  brief: 本地一周40次实验最佳验证.91；权重目录仅剩一个model.pt，词表昨天更新后相同固定输入预测类别变了；没有历史词表副本。只有一张旧GPU能回放，不能重做40次。
  required_observables:
  - 40次仅1文件
  - '.91'
  - 词表无历史
  - 1旧GPU不可重跑全部
  symptom_shape: silent
  asks:
  - type: application
    angle: 制定下一次可追溯发布的制品绑定方案。
  - type: boundary
    angle: 只能先保存完整版本包或先追求跨硬件逐位复现，你优先哪个？
  instantiates:
  - experiment_tracking
  - model_versioning
  - validation_split
  - model_deployment
  expected_elements:
  - 机制: 指标必须关联代码、数据切分、配置及预处理/权重版本，否则无法定位性能变化来源。
  - 应用: 为每次 run 保存不可变标识、随机种子、环境和指标，发布绑定模型与特征处理版本并做固定样本回归。
  - 边界: 固定种子不保证跨硬件逐位一致；反复根据同一验证集选模型会造成选择偏差。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/abs/1607.00673 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_agent_webshop
  title: 购物 agent 的失败动作与预算
  brief: 联网云端购物模拟器中，代理总预算10次工具调用、30秒；目标含运费总价<50美元、蓝色M码。已用7次和21秒，摘要说有货，详情显示M缺货；单次调用最多3秒，没有真实付款授权。
  required_observables:
  - 剩3调用9秒
  - 含运费<50
  - 蓝M缺货
  - 仅模拟无付款
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 决定代理接下来应执行的一个动作。
  - type: boundary
    angle: 只够核验一个候选或直接终止，你如何取舍？
  instantiates:
  - agent_tool_use
  - language_model
  - experiment_tracking
  - browser_use
  expected_elements:
  - 机制: 工具观察可修正模型先验计划；摘要与详情冲突时需要以任务相关的可验证状态为准。
  - 应用: 记录每步调用与返回，核验库存、颜色、尺码和总价；预算不足时明确未完成而非捏造成功。
  - 边界: 论文中的模拟购物任务不意味着有真实支付授权；工具返回也可能不完整或含不可信指令。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2210.03629 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_logistic_stability
  title: 大词表交叉熵数值溢出
  brief: 本地7B训练，32层宽4096、B1长512、FP16、checkpointing开、FlashAttention开，词表128K。logits一行最大100、次大99、其余≤0，线性层输出有限；交叉熵输出NaN，FP32稳定参考给loss约1.313（标签为次大项）。不能全模型改FP32。
  required_observables:
  - logits100/99
  - 线性输出有限
  - 参考loss1.313
  - FP16
  - 不可全FP32
  symptom_shape: crash
  asks:
  - type: application
    angle: 修复交叉熵数值路径。
  - type: boundary
    angle: 只能改前向归约精度或调loss scale，你先改哪项？
  instantiates:
  - softmax
  - activation
  - cross_entropy
  - mixed_precision
  expected_elements:
  - 机制: 先减最大值与logsumexp避免指数溢出，混合精度需关键归约稳定。
  - 应用: 比较稳定交叉熵内核与FP32归约，查梯度和loss scaling。
  - 边界: loss scaling不能修复前向已发生的溢出。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_transfer_resolution
  title: 视觉基础模型冻结后的训练态
  brief: 本地离线ResNet-50迁移200图，每批2张、224输入、float32、checkpointing关，无注意力；训练前后权重校验和完全相同，BN缓冲均值却从0变1.5。固定验证图eval概率由.8变.5；同预算ViT对照权重与输出均不变。只能多做一次迁移实验。
  required_observables:
  - 200图/B2
  - 权重相同
  - BN均值0→1.5
  - eval .8→.5
  - 一次实验
  symptom_shape: bias
  asks:
  - type: application
    angle: 修订冻结骨干的迁移流程。
  - type: boundary
    angle: 只能冻结统计或重估新域统计，你根据什么选一项？
  instantiates:
  - resnet
  - batch_norm
  - fine_tuning
  - vision_transformer
  expected_elements:
  - 机制: 冻结梯度不等于冻结状态；BN依赖批统计，LayerNorm不同。
  - 应用: 同时核验eval/train与可训练参数，用统一划分比较迁移方案。
  - 边界: eval模式不保证域适配最佳；两类归一化不可直接类推。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 现代大模型机制教学改写；具体数字与脏约束为编者设定。
- id: scen_wp1b_decoder
  title: 低损失续写重复的因果检查
  brief: 本地离线7B decoder，32层宽4096、32头，B1、长2048、bf16、checkpointing开、FlashAttention关；训练loss=.1，生成时反复输出同一句。对缓存序列只替换未来100token，较早位置预测也改变；逐位置输入和标签可供检查，但原始文本不能重取。
  required_observables:
  - loss.1
  - 未来扰动改变过去
  - 仅token缓存
  - 不能重取
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 设计利用现有缓存恢复合法自回归训练的流程。
  - type: boundary
    angle: 只能先修因果目标或补新语料，你在无原文条件下如何取舍？
  instantiates:
  - decoder_only
  - causal_mask
  - causal_language_modeling
  - transformer
  expected_elements:
  - 机制: '自回归位置不能依赖未来；扰动测试支持可见性泄漏，具体mask与标签错误须分开验。'
  - 应用: 核验移位标签、掩码形状及跨样本边界，重建合法验证集。
  - 边界: 低训练loss不能证明因果生成能力；修掩码后须重训或继续训练验证。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_position
  title: 位置扩窗不是改一个常数
  brief: 本地两张80GiB卡推理7B，32层宽4096、32Q/8KV头、头维128，B1、bf16、FlashAttention开、checkpointing不适用；训练窗口8K，需从64K合同取金额。4K处准确95%、60K处40%，相同金额移到4K又95%。不能丢条款，仅能做一轮长文适配。
  required_observables:
  - 8K训练/64K合同
  - 位置迁移95%/40%
  - 两张80GiB
  - 不能丢条款
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计覆盖全合同的长文金额提取方案。
  - type: boundary
    angle: 只能投长文继续训练或分段检索聚合，你如何选择？
  instantiates:
  - rope
  - context_extension
  - long_context_training
  - gqa
  expected_elements:
  - 机制: 旋转位置相位与训练长度分布影响外推；GQA降低KV头数但不解决位置外推。
  - 应用: 比较位置插值、长序列继续训练与检索基线，分别测短文退化和远距离检索。
  - 边界: 支持64K输入不代表能使用64K信息；GQA也不等于压缩所有注意力计算。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.15595 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_moe
  title: 专家拥塞与跨机通信
  brief: 云内4机8专家top2推理，隐藏4096、bf16、每批4096token，32个MoE层；每层8192次分发中90%分给两个专家，最忙专家占45%。有效跨机25Gbps，无公网且不能丢token；通信面板显示每层约100MB跨机流量。
  required_observables:
  - 8192分发/层
  - 热点45%
  - 100MB/层
  - 25Gbps
  - 不丢token
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 改造不丢token的专家调度。
  - type: boundary
    angle: 只能扩大专家容量或调整路由均衡，你先改哪项？
  instantiates:
  - mixture_of_experts
  - expert_routing
  - load_balancing_loss
  - expert_parallelism
  expected_elements:
  - 机制: 稀疏激活由路由决定；专家热点与all-to-all通信造成尾延迟。
  - 应用: 测专家token直方图与通信占比，权衡负载均衡、容量和专家放置。
  - 边界: 总参数量不是每token计算量；均衡可能损害专业化且无法消除带宽瓶颈。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2401.04088 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_pretrain
  title: 重复网页吃掉训练预算
  brief: 预训练总预算300B token，审计30%为镜像近重复、代码仅2%；留出基准中有题干与爬取文档逐字相同。不能增加token预算或重新采集，可从已有未用语料补齐。
  required_observables:
  - 300B
  - 重复30%
  - 代码2%
  - 逐字重叠
  - 已有候补
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 重排这次训练的语料流水线。
  - type: boundary
    angle: 固定300B下只够优先清污染或提升代码占比，你先选哪个？
  instantiates:
  - data_deduplication
  - data_mixture
  - quality_filtering
  - pretraining_contamination
  expected_elements:
  - 机制: 重复与混合比例改变有效训练分布，污染会虚增评测。
  - 应用: 做文档及近重复过滤、基准隔离和分域消融，再确定配比。
  - 边界: 过强去重会误删合理模板；高分不能单凭重叠检测解释为记忆。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_sft
  title: 客服微调的角色模板错位
  brief: 本地不联网7B，32层宽4096，B1长1024、bf16基座、checkpointing/FlashAttention开；卡24GiB，仅可训练增量。有2万轮客服对话和5亿token手册；输入含手机号时回复常逐字复述号码，日志中用户与助理片段的逐token损失均非零。不能保留真实手机号作测试。
  required_observables:
  - 24GiB增量
  - 2万对话
  - 5亿token
  - 两角色损失非零
  - 隐私不能留存
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计受限显存下的客服适配训练流程。
  - type: boundary
    angle: 只够一轮SFT或继续预训练，你先选哪个以改善客服回复？
  instantiates:
  - supervised_fine_tuning
  - instruction_tuning_data
  - continued_pretraining
  - peft
  expected_elements:
  - 机制: SFT对目标回复建模；继续预训练学习域分布，PEFT只更新参数子空间。
  - 应用: 统一聊天模板和回复mask，隔离隐私与验证集，对比域预训练和SFT。
  - 边界: PEFT不是数据安全机制；小训练loss不证明业务遵循或无遗忘。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2412.15115v1 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_preference
  title: 偏好标签学到的是长度
  brief: 12000对客服偏好中80%胜者更长；更新后独立1000题解决数从700降至600，奖励均值却升高。按长度匹配的200对重评中旧模型胜110次、新模型90次；不能新雇标注员，只可复用现有审计员一天。
  required_observables:
  - 80%长胜
  - 700→600/1000
  - 匹配组110:90
  - 一天审计
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定下一轮偏好数据修订方案。
  - type: boundary
    angle: 只够长度分层重采样或继续最大化现有奖励，你选哪项？
  instantiates:
  - preference_data
  - reward_model
  - rlhf
  - reward_hacking
  expected_elements:
  - 机制: 奖励模型拟合比较标签，策略能利用长度等伪特征。
  - 应用: 按长度与问题类型分层审计、留出人工盲测，追踪奖励和任务成功率。
  - 边界: 奖励更高不是更符合人类意图；原标签有系统偏差时优化不能自行纠正。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2203.02155 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_dpo
  title: 偏好更新中的参考漂移
  brief: 本地7B偏好适配，32层宽4096，B1长1024、bf16、checkpointing/FlashAttention开，5000对数据20轮。留出胜率升10点而JSON合规跌15点；固定100条序列的参考logprob每个更新步都变化，输入和评估随机性固定。只够重跑一轮配置。
  required_observables:
  - 5000对20轮
  - 参考logprob变化
  - 胜率+10/合规−15
  - 一次重跑
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 修订偏好优化以保护格式能力。
  - type: boundary
    angle: 只够修参考快照或补偏好数据，你先做哪项？
  instantiates:
  - direct_preference_optimization
  - reference_policy
  - kl_regularization
  - preference_data
  expected_elements:
  - 机制: DPO以固定参考策略构造成对目标，β控制相对参考的优化权衡。
  - 应用: 固定参考快照，检查chosen/rejected方向和长度归一化，以留出任务比较β及轮数。
  - 边界: 离线偏好覆盖不到新分布；不训练独立奖励模型不等于没有偏好偏差。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2305.18290 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_ppo
  title: 策略更新幅度失控
  brief: 本地7B策略LoRA训练，32层宽4096，B=256条回复分微批1、长512、bf16、checkpointing/FlashAttention开；同一批做16次更新，共享骨干value头。KL按每token均值从.02在第12次升到2，裁剪比例同时从.1升.9；奖励只在终态返回，下一批尚未采样。
  required_observables:
  - 同批16更新
  - 第12次KL .02→2
  - 裁剪.1→.9
  - 终态奖励
  symptom_shape: spike
  asks:
  - type: diagnosis
    angle: 决定这批轨迹接下来如何更新。
  - type: boundary
    angle: 只准回滚重采样或沿用该批减学习率，你选哪项？
  instantiates:
  - ppo
  - advantage_estimation
  - policy_gradient
  - actor_critic
  expected_elements:
  - 机制: PPO约束概率比变化，优势估计与价值基线影响梯度方差。
  - 应用: 审计旧策略logprob、mask、优势尺度、裁剪率与KL，降低重复更新并留回滚点。
  - 边界: 裁剪不是严格的KL上界；价值误差和偏好误差仍可导致坏策略。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/1707.06347 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_reasoning
  title: 可验证奖励也能被钻空子
  brief: 数学策略每题8条采样，验证器仅给最终数值相等时奖励1；原题700/1000通过，同题单位从米改厘米后200/1000通过。人工抽样显示文字仍用米却提交原数也被判通过。每天4GPU小时，8采样一轮恰耗4小时。
  required_observables:
  - 8采样
  - 700→200
  - 单位错误仍过
  - 4GPU小时
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 在每日预算内改造可验证奖励实验。
  - type: boundary
    angle: 只够补单位检查或增加采样到16条，你先改哪项？
  instantiates:
  - grpo
  - reasoning_rl
  - verifiable_reward
  - reward_hacking
  expected_elements:
  - 机制: 组内相对奖励降低基线依赖，但验证器定义优化方向。
  - 应用: 加入单位与等价表达检查，审计作弊样本，对比难度分层通过率和计算成本。
  - 边界: 全组同分可能没有有效优势；可验证不等于验证器完备。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2402.03300 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_constitution
  title: AI反馈与拒答过度
  brief: 20条原则生成10000对AI偏好；独立集1000条恶意请求拒答950条，1000条医学学习请求误拒300条。原则不得删除，允许澄清范围；只能人工复核100条争议样本。
  required_observables:
  - 20原则不得删
  - 950/1000恶意拒答
  - 300/1000误拒
  - 复核100
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 修订原则反馈的数据生成流程。
  - type: boundary
    angle: 100条预算优先审误拒或漏拒，你如何分配？
  instantiates:
  - constitutional_ai
  - rlaif
  - harmlessness
  - jailbreak
  expected_elements:
  - 机制: 原则指导批评修订与AI偏好，反馈模型偏差会被继承。
  - 应用: 拆分有害、良性敏感与越狱集，盲测误拒和漏拒，复查原则冲突。
  - 边界: 原则文本不是安全证明；AI反馈不能替代独立人类审计。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2212.08073 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_injection
  title: 检索网页把客服变成转账器
  brief: 联网云端客服每天从200个外部网页检索；一次测试中网页原文含要求转账的指令，随后工具轨迹出现用户未授权的付款调用，收款方与页面文字一致。实际付款工具可用，日志禁止含卡号；只能改一个执行关口。
  required_observables:
  - 外部页面指令
  - 未授权付款
  - 卡号不可记录
  - 一个关口
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 设计阻止未授权副作用的执行关口。
  - type: boundary
    angle: 只能做提示词防护或付款前授权校验，你先部署哪项？
  instantiates:
  - prompt_injection
  - indirect_prompt_injection
  - retrieval_poisoning
  - retrieval_augmented_generation
  expected_elements:
  - 机制: 检索内容是低信任数据，可能伪装成指令越过信任边界。
  - 应用: 标记来源信任，隔离工具权限，敏感行动走审批，构造恶意网页回归集。
  - 边界: 仅提示模型忽略攻击并不可靠；引用准确也不能证明动作获得授权。
  difficulty: high
  source:
    type: engineering
    ref: https://genai.owasp.org/llm-top-10/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_permissions
  title: 付款工具必须停在授权关口
  brief: 云内退款机器人可调用查询、退款等6个工具，不可访问公网；业务规定同一订单累计退款≤500元。测试请求连续发20笔499元，前两笔已成功；第3笔审批服务超时，客户未追加有效授权。只能改一个服务端校验点。
  required_observables:
  - 累计≤500
  - 20×499
  - 前两笔成功
  - 审批超时
  - 一个校验点
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 改造退款执行授权。
  - type: boundary
    angle: 只能保证可用性或超时默认拒绝，你会如何落地选择？
  instantiates:
  - excessive_agency
  - least_privilege
  - authorization_boundary
  - human_approval
  expected_elements:
  - 机制: 权限与业务累计额度应由确定性执行层限制，审批绑定具体动作。
  - 应用: 给最小作用域凭据，服务端检查累计额度，审批失效默认拒绝并审计。
  - 边界: 用户对话中的同意不自动等于有效授权；单笔限制挡不住分拆攻击。
  difficulty: high
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/safety/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_guardrail
  title: 护栏漏报和误杀同时发生
  brief: 本地不联网护栏测试1000条：100条隐私攻击中漏过3条，900条合法法律研究中误拦80条。单次护栏p99=90ms，预算100ms；原文和日志均不能出网，只够增加一层检查。
  required_observables:
  - 3/100漏报
  - 80/900误报
  - 90/100ms
  - 不出网
  - 一层
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计下一层可在本地上线的防护。
  - type: boundary
    angle: 只能降低漏报或降低误杀，你如何选择新增检查位置？
  instantiates:
  - guardrails
  - red_teaming
  - blue_team_defense
  - sensitive_disclosure
  expected_elements:
  - 机制: 输入、工具内和输出检查针对不同威胁；红队测攻击面而非只看平均分。
  - 应用: 分层记录漏报误报，脱敏本地日志，以攻击回归与合法集评估纵深措施。
  - 边界: 单个分类器分数不是端到端安全保证；阈值存在业务风险取舍。
  difficulty: high
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/safety/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_sandbox
  title: 桌面插件误删共享文件
  brief: 本地桌面代理整理300文件，工具超时10秒后返回失败；刷新目录可见共享盘原有20文件不见，执行状态未知，无回收站权限。可写临时目录但共享盘含他人数据，不能出网。
  required_observables:
  - 超时10s
  - 20文件不见
  - 无回收站
  - 共享盘他人数据
  - 临时目录可写
  symptom_shape: crash
  asks:
  - type: diagnosis
    angle: 决定恢复工作流的第一步。
  - type: boundary
    angle: 只能先自动重试或人工核对外部状态，你选择哪项？
  instantiates:
  - sandbox_execution
  - computer_use
  - agent_plugins
  - tool_error_recovery
  expected_elements:
  - 机制: 执行沙箱限制影响范围；工具超时不表示副作用未发生。
  - 应用: 使用只读挂载、最小写域、幂等动作ID和状态核对，破坏性动作需审批。
  - 边界: 沙箱不能修复已暴露的外部凭据；UI动作通常不天然幂等。
  difficulty: high
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/safety/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_function
  title: 工具JSON合法但语义危险
  brief: 云内订单接口amount整数单位为分；用户要付5元，轨迹传amount=500，回执却扣500元。每分钟100请求，20%用户姓名含非ASCII字符，姓名原样回显验收；不能修改下游扣款API，只能改适配层。
  required_observables:
  - 5元
  - amount500
  - 回执500元
  - 100/min
  - 20%非ASCII
  - 仅适配层
  symptom_shape: bias
  asks:
  - type: diagnosis
    angle: 修订适配层调用契约以阻断错误扣款。
  - type: boundary
    angle: 只能先补语义金额检查或JSON结构校验，你优先哪项？
  instantiates:
  - function_calling
  - tool_schema
  - structured_outputs
  - agent_tool_use
  expected_elements:
  - 机制: 模式约束字段类型和结构，不保证单位、权限和业务语义。
  - 应用: 模式声明单位枚举，执行层校验边界与权限，分离参数生成和执行。
  - 边界: 合法JSON不等于正确调用；自动重试不能替代语义验证。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/tools/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_loop
  title: 代理无限循环重搜同一页面
  brief: 联网云端代理上限30次调用；前20次反复搜索同一返回403页面，第21次提议登录，而用户最初禁止登录。上下文窗口不可扩大，授权约束必须始终有效；还剩9次调用预算。
  required_observables:
  - 30次上限
  - 重复20次403
  - 禁止登录
  - 剩9次
  - 不可扩窗
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 改造剩余回合的控制策略。
  - type: boundary
    angle: 只能保留完整历史或单独保留不可变权限，你在固定窗口下选哪项？
  instantiates:
  - agent_loop
  - agent_harness
  - context_management
  - session_memory
  expected_elements:
  - 机制: harness负责终止、预算与状态，压缩记忆可能丢掉不可变约束。
  - 应用: 区分事实记忆与权限约束，记录尝试历史，设预算和明确失败出口。
  - 边界: 更长上下文不保证可靠状态；总结不是原始轨迹的无损替代。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_mcp
  title: 接上MCP并不等于能信任服务器
  brief: 云内客户端接3个MCP服务器，其中2个均声明pay工具；2租户回归中A请求工具资源时拿到B订单摘要。抓包可见相同凭据标识用于两租户，不能访问公网，允许改客户端与授权网关。
  required_observables:
  - 3服务器同名pay
  - 2租户串摘要
  - 凭据标识相同
  - 不出网
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 设计租户与工具身份隔离的接入流程。
  - type: boundary
    angle: 只能先隔离凭据或仅给工具重命名，你优先哪项？
  instantiates:
  - mcp
  - mcp_tools
  - mcp_resources
  - mcp_authorization
  expected_elements:
  - 机制: MCP区分工具与资源能力，协议协商不替代授权或工具可信度判断。
  - 应用: 按服务器命名空间和租户隔离，校验工具模式与授权作用域，不透传无关token。
  - 边界: 协议兼容不等于服务器可信；资源文本仍可能含提示注入。
  difficulty: high
  source:
    type: engineering
    ref: https://modelcontextprotocol.io/specification/2025-06-18 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_trace
  title: 跨代理交接后无法复现失败
  brief: 云内售后流程4次交接，100任务12次最终答案缺订单号；日志只有最终文本，昨天模型版本更换。输入100条都有订单号，工具仅允许本地脱敏回放；只能增加一类追踪跨度。
  required_observables:
  - 4交接
  - 12/100丢号
  - 输入完整
  - 只有终态
  - 版本更换
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计能定位首次丢号位置的追踪。
  - type: boundary
    angle: 只能记录交接状态或完整未脱敏提示，你选哪项？
  instantiates:
  - agent_tracing
  - handoff
  - workflow_orchestration
  - model_versioning
  expected_elements:
  - 机制: 交接传递控制与状态，追踪应连接输入、工具、版本和终止原因。
  - 应用: 用关联ID记录脱敏跨度，固定工具和模型快照复放，检测交接契约。
  - 边界: 只重放文本不一定复现外部系统状态；轨迹完整也不证明决策正确。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_wiki
  title: LLM wiki陈旧与越权检索
  brief: 云内知识库10万页每小时更新、每块500token；撤权后原文请求返回403，但同租户旧会话摘要仍含该页段落并生成引用。回答要求2秒内，禁止访问公网；只能改一层缓存失效机制。
  required_observables:
  - 10万页小时更新
  - 500token块
  - 原文403/摘要可读
  - 2s
  - 一层失效
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 制定撤权可贯穿摘要路径的修复。
  - type: boundary
    angle: 只够缩短缓存TTL或按权限事件失效，你优先哪项？
  instantiates:
  - persistent_knowledge
  - session_memory
  - citation_grounding
  - chunking
  expected_elements:
  - 机制: 持久知识与会话记忆生命周期不同，引用需能定位原文及访问版本。
  - 应用: 将权限与版本元数据贯穿索引、检索、摘要和缓存，安排失效与删除。
  - 边界: 有引用不保证引文支持答案；摘要缓存可能绕过原始文档撤权。
  difficulty: high
  source:
    type: engineering
    ref: https://google.github.io/adk-docs/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_hybrid
  title: 稀疏精确词与语义检索冲突
  brief: 本地不联网200万工单，768维float32向量；错误码E-104在库内且字面查询可找到，稠密top20没有该工单。进程内存16GiB、召回预算80ms，现有稠密检索p99=65ms；只能增加一个召回通道。
  required_observables:
  - 2M×768fp32
  - 16GiB
  - E-104稠密未召回
  - 65/80ms
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 改造错误码检索以满足召回与预算。
  - type: boundary
    angle: 只够做混合召回或重排top20，你先做哪项？
  instantiates:
  - dense_retrieval
  - hybrid_search
  - reranking
  - vector_index
  expected_elements:
  - 机制: 稀疏匹配擅长精确词，稠密匹配语义，重排只处理召回候选。
  - 应用: 融合候选分数或秩，测召回率与延迟后重排，按错误码和改写分层。
  - 边界: 重排救不了从未召回的文档；近似向量索引有召回延迟权衡。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2004.04906 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_search
  title: 搜索摘要引用了过期价格
  brief: 离线本地学生模型只有去年数据，不得联网；上游仅提供3个月前价格搜索快照，用户要求今天价格并需5秒内回复。没有今日来源或允许呼叫的外部工具，不能捏造报价。
  required_observables:
  - 离线
  - 去年参数
  - 3个月前快照
  - 今天价格
  - 5s
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定此请求可诚实交付的响应策略。
  - type: boundary
    angle: 只能给带时间戳历史价或拒绝报数，你如何选择？
  instantiates:
  - web_search
  - citation_grounding
  - retrieval_augmented_generation
  - knowledge_distillation
  expected_elements:
  - 机制: 搜索提供外部证据，生成需对齐时间与引文；参数知识更新不及时。
  - 应用: 核对页面日期与原文，缓存加时效元数据，学生缺证据时明确拒绝实时断言。
  - 边界: 蒸馏不能保证知识实时；搜索排名与摘要都不是事实权威。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/tools/ — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_vlm
  title: 高分图文模型看错小字
  brief: 本地离线VLM处理1024平方海报，药名字高12像素；视觉输入统一到336平方后给出语法正确但药名错的描述。原图裁剪药名放到336输入时100例读对90，整图仅40；只有500标注且禁止上传云。
  required_observables:
  - 1024→336
  - 12像素药名
  - 裁剪90/100整图40/100
  - 500标注
  - 禁云
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计本地药名读取流程。
  - type: boundary
    angle: 只够提高视觉输入成本或做500例指令适配，你优先哪项？
  instantiates:
  - vlm
  - vision_projector
  - visual_instruction_tuning
  - multimodal_hallucination
  expected_elements:
  - 机制: 视觉编码经连接器映射语言空间；指令调优不保证细粒度识别。
  - 应用: 本地对照裁剪放大与OCR，区分看不清、连接器和语言臆测误差。
  - 边界: 流畅描述和置信语气不是视觉证据；低分辨率丢失的信息不能靠提示恢复。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_clip
  title: 图文检索与定位不是一回事
  brief: 本地离线仓储50类零件，CLIP零样本检索在100张测试图80张类别正确；当前接口只返回类别相似分，不返回坐标。新任务需瑕疵框，现场仅30张带框图且不得云端标注。
  required_observables:
  - 50类80/100
  - 接口无框
  - 30带框
  - 本地禁云
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计最小可验收的瑕疵定位方案。
  - type: boundary
    angle: 只够做区域标注适配或优化全局文本提示，你先做哪项？
  instantiates:
  - clip
  - visual_grounding
  - vision_transformer
  - cross_entropy
  expected_elements:
  - 机制: CLIP对齐全局图文表示，不直接训练精确坐标预测。
  - 应用: 分别评估检索与定位，补区域监督或定位模型，检查域差异。
  - 边界: 高检索分不证明定位能力；相似类别和细小缺陷可能不可分。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2103.00020 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_video
  title: 视频安全监测漏过六帧事件
  brief: 本地离线视频监测，10分钟30fps，当前均匀只取16帧；碰撞持续.2秒，事故窗口与抽帧相位随机。总内存8GiB，单帧解码后6MiB，不能常驻全片；测试100次短事件仅检出1次，静态MMMU得分高。
  required_observables:
  - 600s×30fps
  - 16帧
  - .2s事件
  - 8GiB
  - 6MiB/帧
  - 1/100
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 改造短事件监测的采样流程。
  - type: boundary
    angle: 只够增加流式时序采样或微调静态问答，你优先哪项？
  instantiates:
  - video_understanding
  - vlm
  - multimodal_benchmark
  - multimodal_hallucination
  expected_elements:
  - 机制: 抽样可能完全漏掉瞬时事件，静态多学科基准不等同视频事件覆盖。
  - 应用: 按事件时长设计抽样与局部加密，独立标注时间窗并测漏检。
  - 边界: 没有观察到不是没有发生；MMMU不能替代时序安全评估。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.13549 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_robot
  title: 语言动作迁移遇上实体风险
  brief: 本地离线机械臂20Hz取杯，仿真100次成功95，湿杯实机100次成功60；闭环传感到动作延迟150ms，滑移超过100ms会掉杯。不得损坏人手模型，只有封闭台架可测。
  required_observables:
  - 20Hz
  - 延迟150ms
  - 滑移100ms
  - 95/100对60/100
  - 禁止伤害
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定安全的实机恢复实验。
  - type: boundary
    angle: 只能先降控制延迟或增加仿真语义数据，你优先哪项？
  instantiates:
  - vla
  - embodied_intelligence
  - action_tokenization
  - closed_loop_control
  expected_elements:
  - 机制: VLA把视觉语言映射动作，动作量化和闭环反馈影响控制精度。
  - 应用: 设安全停止和力限，分层核验感知、动作映射、时延与域差异。
  - 边界: 网络语义知识不能保证物理可行性；仿真开环分数不代表实机安全。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2307.15818 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_drive
  title: 驾驶规划被离线指标骗过
  brief: 封闭场自动驾驶雨夜评估，离线平均轨迹误差.3米；闭环100次碰撞5次，雷达帧随机缺失20%，无缺失对照100次碰撞1次。只允许封闭测试，不可上公共道路验证；下一轮仅100次。
  required_observables:
  - 误差.3m
  - 5/100碰撞
  - 雷达20%缺失
  - 对照1/100
  - 仅封闭100次
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 安排下一轮能验证缺失鲁棒性的闭环测试。
  - type: boundary
    angle: 100次只能优先测缺失场景或一般雨夜，你如何分配？
  instantiates:
  - autonomous_driving
  - bev_representation
  - motion_prediction
  - closed_loop_control
  expected_elements:
  - 机制: 鸟瞰表示与未来预测服务规划，闭环误差会改变后续观测。
  - 应用: 测碰撞、越界与干预率，加入遮挡、雨夜和传感器缺失分层回归。
  - 边界: 低平均轨迹误差不是安全证明；封闭场泛化到公共道路仍需验证。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2212.10156 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_diffusion
  title: 引导太强带来过饱和
  brief: 本地离线860M潜空间扩散推理，512平方、B1、FP16、checkpointing不适用、普通注意力无Flash；12GiB卡峰值8GiB。从50步CFG5同时改10步CFG20，固定提示集出现颜色通道大量255截顶、100图仅20种布局，原版70种；时限只准10步。
  required_observables:
  - 12GiB峰8
  - 10步上限
  - CFG5→20
  - 255截顶
  - 20/70布局
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 修订10步预算内的采样配置。
  - type: boundary
    angle: 只能降低CFG或回到50步，你选哪项以守住时限？
  instantiates:
  - diffusion_model
  - ddpm
  - classifier_free_guidance
  - text_to_image
  expected_elements:
  - 机制: 去噪学习噪声条件分布，条件与无条件预测差经CFG放大。
  - 应用: 分别扫描采样步数与引导强度，固定种子评估语义、多样性和速度。
  - 边界: 更强引导不必然更好；相同种子跨采样器也不保证可比轨迹。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2209.00796v15 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_dit
  title: 潜空间换Transformer后瓶颈仍在
  brief: 本地8卡各80GiB训练DiT-XL，28层宽1152、16头，B1每卡、bf16、checkpointing关、FlashAttention关；VAE下采样8、latent patch2。使用无动量SGD；512输入峰值8GiB，实测分解为固定6GiB、线性激活1GiB、注意力相关1GiB；1024输入26GiB；同图仅VAE重建后小字已无法辨读。卡数不可增加。
  required_observables:
  - VAE8/patch2
  - 512→1024
  - 8→26GiB
  - B1bf16无checkpoint/flash
  - 小字重建丢失
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定兼顾小字与现有资源的升级方案。
  - type: boundary
    angle: 只能改VAE或扩大DiT，你先改哪项以恢复小字？
  instantiates:
  - dit
  - latent_diffusion
  - vae
  - transformer
  expected_elements:
  - 机制: 潜空间压缩减少token数，DiT仍受注意力token规模与VAE信息损失约束。
  - 应用: 测编码重建上限、patch数和注意力开销，再决定分辨率与并行。
  - 边界: 更大DiT不能恢复编码器已丢信息；潜空间压缩并非无损。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2212.09748 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_flash
  title: 换FlashAttention后算式没近似
  brief: 本地A100上7B训练，32层宽4096、32头，B1长8192、bf16、checkpointing关；普通注意力峰60GiB，换FlashAttention后30GiB。相同QKV含padding、无dropout，输出最大绝对差1e-3，FP32参考容差2e-3；预算一轮回归，需决定能否替换。
  required_observables:
  - A100
  - B1/8192/bf16
  - 60→30GiB
  - 差1e-3/容差2e-3
  - padding
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计此次内核替换的验收。
  - type: boundary
    angle: 只够测mask梯度一致性或再测单一吞吐，你先测哪项？
  instantiates:
  - flash_attention
  - attn_scaled_dot_product
  - gpu_compute
  - multihead_attention
  expected_elements:
  - 机制: FlashAttention通过分块与重算减少高带宽内存访问，目标仍是精确注意力。
  - 应用: 比较容差、mask、dtype与梯度，量测内核兼容性及实际显存。
  - 边界: 浮点误差不等于算法近似；长序列算术复杂度并未自动变线性。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2205.14135 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_kv
  title: 并发长对话击穿KV显存
  brief: 云内80GiB单卡7B推理，32层宽4096、32Q/8KV头、头维128，bf16、FlashAttention开、checkpointing不适用，权重约14GiB。100并发中长度从320至32000token，压力测试全部达32000时分配KV报CUDA
    out of memory；不增卡，需保留每会话长度。
  required_observables:
  - 80GiB权重14
  - 100×32000
  - 32层8KV/128/bf16
  - 不增卡保长度
  symptom_shape: crash
  asks:
  - type: diagnosis
    angle: 制定不OOM的会话准入与调度方案。
  - type: boundary
    angle: 只能分页KV或限制同时驻留长会话，你先选哪项？
  instantiates:
  - kv_cache
  - paged_attention
  - continuous_batching
  - gqa
  expected_elements:
  - 机制: KV随层、头、上下文和并发增长，分页减少碎片，GQA减KV头数。
  - 应用: 估KV容量，做准入与连续批处理，测吞吐和长短请求公平性。
  - 边界: 分页不消除KV容量成本；提高批量可能恶化尾延迟。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2309.06180 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_prefill
  title: 共享公开前缀与租户隔离
  brief: 云内两个权限不同租户的7B推理，32层宽4096、32Q/8KV头，bf16、B1、FlashAttention开、checkpointing不适用；90%请求共享8K公开系统前缀，首token2秒，其中前缀prefill1.6秒。租户私有后缀不同，缓存预算只够公开前缀一份，禁止跨租户私有信息复用。
  required_observables:
  - 90%共享8K公开前缀
  - 2s中1.6s
  - 两租户
  - 一份公开缓存
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定兼顾隔离的前缀缓存策略。
  - type: boundary
    angle: 只能共享公开前缀或缓存完整私有请求，你在该预算下选哪项？
  instantiates:
  - prefix_caching
  - prefill_decode
  - serving_slo
  - latency
  expected_elements:
  - 机制: prefill建立上下文KV，decode逐token追加；相同有效前缀可复用。
  - 应用: 缓存键包含模型、模板及权限隔离域，分别观测TTFT与每token延迟。
  - 边界: 高缓存命中不保证隐私隔离；decode带宽瓶颈可能仍在。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2309.06180 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_quant
  title: 4bit适配后长尾任务崩溃
  brief: 本地离线8GiB卡部署7B，32层宽4096、32Q/8KV头，B1长512、4bit权重bf16激活、FlashAttention开、checkpointing不适用。1000例QLoRA适配后均分仅降1点，财务子集降20点；量化前同子集正常，校准记录无财务数据。禁止上传财务原文。
  required_observables:
  - 8GiB
  - 7B4bit
  - B1/512
  - 财务−20均分−1
  - 无财务校准
  - 禁上传
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计本地财务退化修复实验。
  - type: boundary
    angle: 只够校准重做或增加LoRA秩，你先选哪项？
  instantiates:
  - weight_quantization
  - activation_quantization
  - qlora
  - lora
  expected_elements:
  - 机制: 量化带来尺度与离群误差；QLoRA在冻结量化基座上训练低秩增量。
  - 应用: 检查校准分布、逐层误差与分域质量，对照精度基线和不同模块精度。
  - 边界: 平均分掩盖尾部退化；低秩适配不保证修复所有量化信息损失。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2306.00978 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_eval
  title: 代理基准成功不等于生产合规
  brief: 联网云端代理在100网页任务、50桌面任务共失败30次；模拟器无付款权限，生产要求真实付款必须审批。日志含用户邮箱不得出网，只有一个隔离测试环境可用于上线验收，不能以AgentBench总分替代验收。
  required_observables:
  - 100+50任务失败30
  - 模拟无付款
  - 生产审批
  - 邮箱不出网
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 制定上线前的任务验收门。
  - type: boundary
    angle: 只能优先补付款安全回归或扩充一般任务数，你先做哪项？
  instantiates:
  - agent_benchmark
  - web_task_success
  - desktop_task_success
  - agent_tracing
  expected_elements:
  - 机制: 不同环境任务与终态判据不一样，轨迹审计揭示中间违规。
  - 应用: 在隔离环境按任务成功、违规、成本分层，脱敏轨迹并固定环境版本。
  - 边界: 最终成功不能掩盖过程越权；跨benchmark分数不可直接比较。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2308.03688 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_budget
  title: 推理预算与投机解码算错收益
  brief: 本地7B目标模型推理，32层宽4096、32Q/8KV头、bf16、B1长512、FlashAttention开、checkpointing不适用；每题1000ms。草稿每轮4token耗40ms，目标验证每轮80ms，串行逐token80ms；接受率由80%降20%。8条推理链只2条不同，实测总耗时1800ms，单链900ms。
  required_observables:
  - 4草稿/40ms
  - 验证80ms
  - 接受20%
  - 1000ms
  - 8链2异1800ms
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 重分配当前题型的推理预算。
  - type: boundary
    angle: 只能保留投机解码或多链采样之一，你选哪项并限制其使用条件？
  instantiates:
  - test_time_compute
  - speculative_decoding
  - self_consistency
  - chain_of_thought
  expected_elements:
  - 机制: 投机解码靠验证接受省主模型步数，推理采样收益取决于候选质量与多样性。
  - 应用: 分别量测接受率、总延迟和准确率，固定计算预算比较采样与单链。
  - 边界: 更长链不保证更正确；投机解码保分布的条件不等于多采样保正确。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2412.15115v1 — 教学改写；数字与脏约束为编者设定，非来源原题或实测。
- id: scen_wp1b_resume
  title: 中断恢复会重复下单吗
  brief: 云内代理上限30轮，第29轮发起付款后断开；恢复文件只到28轮，外部服务不能回滚但可按订单号查询状态。用户未授权重复付款，恢复时查到订单处于处理中；只能再用2轮。
  required_observables:
  - 上限30/保存28
  - 第29付款
  - 处理中
  - 不可回滚可查询
  - 不许重复
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 决定恢复后的第一步动作。
  - type: boundary
    angle: 只够等待查证或重发付款，你如何取舍可用性与重复扣款风险？
  instantiates:
  - run_resumption
  - turn_budget
  - termination_policy
  - tool_error_recovery
  - agent_harness
  expected_elements:
  - 机制: 恢复状态与外部副作用不同步可能重复执行，轮次预算是harness约束。
  - 应用: 保存动作ID和检查点，恢复前核对外部状态，耗尽预算显式退出。
  - 边界: 状态恢复不是分布式恰好一次保证。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/running_agents/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_contexts
  title: 本地权限对象进入了模型提示
  brief: 本地多租户代理，执行上下文持有100个客户凭据，模型窗口8K；捕获的发往模型的提示中出现其中一个完整凭据。工具列表随租户变化，A会话偶见B工具名，服务端仍拒绝A调用B。可改一个导出接口，不允许把凭据送外网。
  required_observables:
  - 100凭据
  - 提示泄露1个
  - 8K
  - A见B工具但服务拒绝
  - 一个导出接口
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 改造模型可见上下文的导出边界。
  - type: boundary
    angle: 只能优先字段允许列表或提示摘要压缩，你先做哪项？
  instantiates:
  - local_context
  - llm_context
  - context_compaction
  - mcp_tool_filter
  - least_privilege
  expected_elements:
  - 机制: 本地执行上下文不应自动暴露给模型，压缩与工具可见性分别管理。
  - 应用: 允许列表导出模型可见字段，压缩保留权限边界，按租户过滤工具。
  - 边界: 隐藏工具名不能取代服务端授权；摘要可能遗漏关键约束。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/context/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_tool_guard
  title: 工具护栏为何没有阻断付款
  brief: 云内付款测试时间线：t=0请求进入，t=100ms扣款500元，t=300ms输入检查返回阻断，随后输出检查阻止发送回复。用户没有付款授权，付款不能撤销，下一版仅允许增加一个阻塞关口。
  required_observables:
  - 100ms扣500
  - 300ms才阻断
  - 无授权
  - 不可撤销
  - 一个阻塞关口
  symptom_shape: silent
  asks:
  - type: diagnosis
    angle: 选择并设计新增的阻塞关口。
  - type: boundary
    angle: 只能放在付款前或最终回复前，你优先哪处？
  instantiates:
  - tool_guardrail
  - input_guardrail
  - output_guardrail
  - guardrail_tripwire
  - guardrail_race
  expected_elements:
  - 机制: 输入、工具和输出护栏覆盖不同执行点，并行运行存在先行动后判决风险。
  - 应用: 副作用之前用阻塞式执行层检查，工具级校验参数权限，记录tripwire终止范围。
  - 边界: 输出护栏不能撤销副作用，护栏异常也不是原子事务。
  difficulty: high
  source:
    type: engineering
    ref: https://openai.github.io/openai-agents-python/guardrails/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_kvquant
  title: KV量化省显存后长文退化
  brief: 云内7B推理，32层宽4096、32Q/8KV头、头维128，B8每条32K、FlashAttention开、checkpointing不适用；权重14GiB不变，FP16 KV占32GiB，运行态其他6GiB。换INT8
    KV后总显存52降36GiB，尾条款召回跌15点，短句校准表现不变。卡上限40GiB，不可缩短合同。
  required_observables:
  - B8/32K
  - KV32→16GiB
  - 总52→36
  - 40GiB
  - 尾召回−15
  - 合同不可缩
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 设计可在40GiB下保护长文质量的缓存方案。
  - type: boundary
    angle: 只能降低并发恢复FP16或保持B8优化KV量化，你先选哪项？
  instantiates:
  - kv_cache_quantization
  - weight_quantization
  - activation_quantization
  - kv_cache
  expected_elements:
  - 机制: KV量化压缩运行态缓存，与权重量化目标不同且误差随访问模式变化。
  - 应用: 分开测权重与KV精度，按上下文长度与位置测质量、显存和延迟。
  - 边界: 节省显存不保证速度提升或所有长度质量不变。
  difficulty: high
  source:
    type: engineering
    ref: https://docs.vllm.ai/en/latest/features/quantization/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_dispatch
  title: 专家并行推理被网络吞掉
  brief: 云内4机每机2GPU的8专家推理，top2、隐藏4096、bf16、B4096token、32个MoE层，FlashAttention开、checkpointing不适用。跨机50Gbps链路有效满载6.25GB/s；每轮各机总跨机流量250MB，轮时由无通信基线60ms升100ms；专家负载均衡，不可加机器。
  required_observables:
  - 4机8GPU
  - 50Gbps
  - 250MB/轮
  - 60→100ms
  - 专家均衡
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 重排专家分发以恢复吞吐。
  - type: boundary
    angle: 只能优化专家放置或继续加张量切分，你先选哪项？
  instantiates:
  - moe_dispatch
  - expert_parallelism
  - inference_tensor_parallel
  - mixture_of_experts
  expected_elements:
  - 机制: 专家分发和结果聚合产生跨设备通信，张量并行有不同通信模式。
  - 应用: 测通信与计算占比、专家token分布，比较局部放置和并行切分。
  - 边界: 更多机器不保证线性加速；路由不均可能使平均带宽指标误导。
  difficulty: high
  source:
    type: engineering
    ref: https://docs.vllm.ai/en/latest/serving/parallelism_scaling/ — 教学改写；数字与脏约束非来源实测。
- id: scen_wp1b_iteration
  title: 多轮后训练格式退化
  brief: 本地7B增量后训练，32层宽4096，B1长1024、bf16、checkpointing/FlashAttention开；SFT后3轮偏好优化，固定200题JSON合规从196降160条。对同一SFT样本的损失探针显示用户片段与助理片段均产生梯度。仅够从一个历史快照重跑一次。
  required_observables:
  - 3轮
  - 196→160/200
  - 两角色有梯度
  - 一次重跑
  - 历史快照
  symptom_shape: degradation
  asks:
  - type: diagnosis
    angle: 安排一次能区分SFT目标与后续覆盖的回滚实验。
  - type: boundary
    angle: 只能回到SFT前修目标或从合规最好快照加约束，你先走哪条路线？
  instantiates:
  - iterative_posttraining
  - sft_loss_mask
  - direct_preference_optimization
  - rejection_sampling
  expected_elements:
  - 机制: '损失mask控制角色监督范围，多阶段更新可能覆盖先前格式行为；探针不能单独确定退化发生在哪阶段。'
  - 应用: '固定200题与阶段快照，单次回滚只改变一个因素；比较合规率与偏好胜率，拒绝采样不得只按长度筛。'
  - 边界: '修复SFT目标未必修复偏好阶段覆盖；200题不能证明分布外合规，资源取舍需明确放弃的收益。'
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/html/2407.21783v3 — 教学改写；数字与脏约束非来源实测。
