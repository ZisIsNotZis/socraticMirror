  source:
    type: exercise
    ref: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_run_lineage
  title: 调参结果无法找到对应制品
  brief: 改写 ML Test Score 的可复现性检查：一周跑 40 次模型，最佳验证分 0.91，但文件均名 model.pt；预处理词表昨天更新，线上预测无法复现，只有一张旧 GPU 可回放。
  asks:
  - type: application
    angle: 定义一次实验必须绑定的输入与发布制品。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - experiment_tracking
  - model_versioning
  - validation_split
  - model_deployment
  expected_elements:
  - 机制: 指标必须关联代码、数据切分、配置及预处理/权重版本，否则无法定位性能变化来源。
  - 应用: 为每次 run 保存不可变标识、随机种子、环境和指标，发布绑定模型与特征处理版本并做固定样本回归。
  - 边界: 固定种子不保证跨硬件逐位一致；反复根据同一验证集选模型会造成选择偏差。
  difficulty: medium
  source:
    type: engineering
    ref: https://arxiv.org/abs/1607.00673 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_agent_webshop
  title: 购物 agent 的失败动作与预算
  brief: 改写 ReAct 的 WebShop 交互任务：只有 10 次工具调用和 30 秒预算，要买价格低于 50 美元、蓝色且 M 码的商品；搜索返回商品摘要，详情页却显示 M 码缺货。
  asks:
  - type: diagnosis
    angle: 解释思考、行动与观察循环，如何证明完成而非仅输出意图。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - agent_tool_use
  - language_model
  - experiment_tracking
  expected_elements:
  - 机制: 工具观察可修正模型先验计划；摘要与详情冲突时需要以任务相关的可验证状态为准。
  - 应用: 记录每步调用与返回，核验库存、颜色、尺码和总价；预算不足时明确未完成而非捏造成功。
  - 边界: 论文中的模拟购物任务不意味着有真实支付授权；工具返回也可能不完整或含不可信指令。
  difficulty: high
  source:
    type: engineering
    ref: https://arxiv.org/abs/2210.03629 — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_logistic_stability
  title: 大幅度 logits 的二分类数值溢出
  brief: 沿 D2L softmax 的数值稳定讨论：二分类 logits 为 1000 与 -1000，float32 直接 exp 后得 inf；10000 条记录中正类仅 1%，训练 loss 变 NaN。
  asks:
  - type: application
    angle: 分开数值稳定性和类别不平衡，不能把 NaN 归因于低正例率。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - logistic_regression
  - activation
  - cross_entropy
  - accuracy
  expected_elements:
  - 机制: sigmoid 对应二类 softmax；直接指数可能溢出，log-sum-exp 或 fused logits loss 避免显式不稳定概率。
  - 应用: 用带 logits 的稳定损失，检查非有限梯度，并另行报告少数类召回而非只看 accuracy。
  - 边界: 加权损失或重采样会改变最优概率解释；稳定计算不能修复标签错误。
  difficulty: medium
  source:
    type: engineering
    ref: https://d2l.ai/chapter_linear-classification/softmax-regression.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
- id: scen_transfer_resolution
  title: 小样本迁移时冻结不等于 eval
  brief: 改写 D2L BN/ViT 训练讨论：用预训练图像模型迁移 400 张工业缺陷图，输入 224²，每卡 batch=2；已冻结骨干参数，但 BN 运行统计仍随训练更新。
  asks:
  - type: application
    angle: 区分 requires_grad、训练模式和验证集选择。
  - type: boundary
    angle: 指出该方案成立的条件以及一个失效反例
  instantiates:
  - image_classification
  - batch_norm
  - fine_tuning
  - vision_transformer
  expected_elements:
  - 机制: 冻结权重梯度与是否更新 BN buffers 是两套机制；不同架构归一化行为不同。
  - 应用: 显式设置需冻结模块模式，保存初始统计作对照；小验证集采用固定切分并报告波动。
  - 边界: ViT 通常用 LayerNorm，不能照搬 BN 修法；小样本验证提升可能只是抽样噪声。
  difficulty: medium
  source:
    type: exercise
    ref: https://d2l.ai/chapter_convolutional-modern/batch-norm.html — 改写自正文/习题；具体数字与故障组合为诊断任务设定，非来源实测或原题逐字转录。
